<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haspot Sim</title>
<style>
:root {
  --ink: #14231F; --ink-2: #2B3D38; --paper: #F6F1E7; --paper-2: #ECE4D4; --paper-3: #E1D6C1;
  --marigold: #E9A23B; --marigold-ink: #8A5A0B; --terracotta: #B5523B; --green: #2F7D4F; --amber: #C98A12;
  --muted: #5B6863; --line: #CDBFA6; --pharmacy: #2E7D6B; --kirana: #8C6A33; --inst: #4A5A8C;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); }
body { display: flex; flex-direction: column; min-width: 1024px; font-size: 13px; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--ink); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button.primary:hover:not(:disabled) { background: var(--ink-2); }
button.accent { background: var(--marigold); border-color: var(--marigold); color: var(--ink); font-weight: 600; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--marigold); outline-offset: 1px; }
input[type=number], input[type=text], select { background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
input[type=number] { width: 110px; }

header { background: var(--ink); color: var(--paper); padding: 6px 12px 6px; display: flex; flex-direction: column; gap: 5px; }
.toprow { display: flex; align-items: center; gap: 14px; }
.brand { font-weight: 700; letter-spacing: .3px; font-size: 15px; white-space: nowrap; }
.brand span { color: var(--marigold); }
.hud { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
.metric { padding: 2px 9px; border-left: 1px solid #33473F; min-width: 0; }
.metric:first-child { border-left: 0; }
.metric .k { font-size: 10.5px; color: #B9C3BD; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
.metric .v { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric .v.neg { color: #F08A70; }
.metric .v.pos { color: #9BD7AE; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
.toolbar button { background: transparent; color: var(--paper); border-color: #3D534A; padding: 3px 9px; }
.toolbar button:hover { border-color: var(--marigold); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 20px; align-items: center; }
.chip { font-size: 11.5px; border-radius: 999px; padding: 2px 9px; background: #23372F; color: var(--paper); border: 1px solid #3D534A; }
.chip.gate { background: var(--marigold); color: var(--ink); border-color: var(--marigold); font-weight: 600; }
.chip.warn { background: var(--terracotta); color: #fff; border-color: var(--terracotta); }
.chip.muted { background: transparent; color: #B9C3BD; border-color: transparent; padding-left: 0; }

main { flex: 1; display: flex; min-height: 0; }
#mapwrap { flex: 1; position: relative; min-width: 0; background: var(--paper-2); overflow: hidden; }
#map { display: block; width: 100%; height: 100%; cursor: grab; }
#map.dragging { cursor: grabbing; }
.overlay { position: absolute; background: rgba(20,35,31,.92); color: var(--paper); border-radius: 8px; padding: 7px 11px; }
#timebox { top: 10px; left: 10px; min-width: 190px; }
#timebox .t { font-size: 17px; font-weight: 700; }
#timebox .sub { font-size: 11.5px; color: #B9C3BD; }
.bar { height: 4px; background: #33473F; border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--marigold); }
#speedbox { top: 10px; right: 10px; display: flex; gap: 4px; align-items: center; padding: 5px; }
#speedbox button { background: transparent; color: var(--paper); border-color: #3D534A; padding: 3px 8px; }
#speedbox button.on { background: var(--marigold); color: var(--ink); border-color: var(--marigold); font-weight: 700; }
#legend { bottom: 10px; left: 10px; font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 20px); }
#legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
#tip { pointer-events: none; display: none; font-size: 12px; max-width: 240px; }
#hint { bottom: 44px; left: 10px; font-size: 12px; background: var(--marigold); color: var(--ink); display: none; }

aside { width: 350px; border-left: 1px solid var(--line); background: var(--paper); overflow-y: auto; display: flex; flex-direction: column; }
section.panel { padding: 10px 12px; border-bottom: 1px solid var(--line); }
section.panel h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.empty { color: var(--muted); font-style: italic; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0; }
.kv div:nth-child(odd) { color: var(--muted); }
.kv div:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.row { display: flex; gap: 8px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
.row label { color: var(--muted); }
.title { font-size: 15px; font-weight: 700; }
.tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px; background: var(--paper-3); margin-left: 4px; vertical-align: 1px; }
.tag.live { background: #D5EBDD; color: #1E5534; }
.tag.dark { background: #F6E3B8; color: #6E4B00; }
.tag.failed { background: #F2D3CB; color: #7A2A17; }
.msg { margin-top: 6px; font-size: 12px; padding: 5px 8px; border-radius: 5px; background: var(--paper-2); }
.msg.bad { background: #F2D3CB; color: #6B2414; }
.msg.good { background: #D5EBDD; color: #1E5534; }
.tabs { display: flex; gap: 4px; }
.tabs button { padding: 2px 8px; font-size: 12px; }
.tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.loop { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 8px 0 4px; }
.loop div { height: 28px; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.slot-host { background: var(--paper-3); color: var(--ink); }
.slot-house { background: var(--ink-2); color: var(--paper); }
.slot-sold { background: var(--green); color: #fff; }
.slot-half { background: linear-gradient(90deg, var(--green) 50%, #fff 50%); color: var(--ink); border: 1px solid var(--green); }
.slot-anchor { background: var(--marigold); color: var(--ink); }
.slot-open { background: #fff; border: 1px dashed var(--line); color: var(--muted); }
.loopkey { font-size: 11px; color: var(--muted); }
ul.list { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; }
ul.list li { padding: 3px 0; border-bottom: 1px dotted var(--line); display: flex; justify-content: space-between; gap: 8px; }
ul.list li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
#log li { display: block; }
#log li b { color: var(--muted); font-weight: 600; margin-right: 4px; }
#log li.good { color: #1E5534; } #log li.bad { color: #7A2A17; } #log li.warn { color: #6E4B00; }

.modal-bg { position: fixed; inset: 0; background: rgba(20,35,31,.55); display: none; align-items: flex-start; justify-content: center; z-index: 10; padding: 40px 16px; overflow-y: auto; }
.modal-bg.open { display: flex; }
.modal { background: var(--paper); border-radius: 10px; width: min(760px, 100%); padding: 18px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.modal.wide { width: min(1080px, 100%); }
.modal h2 { margin: 0 0 4px; font-size: 19px; }
.modal .lede { color: var(--muted); margin: 0 0 12px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.field label { display: block; font-weight: 600; margin-bottom: 3px; }
.field .note { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 8px 12px 10px; }
legend { font-weight: 700; padding: 0 4px; }
.cfg-row { display: grid; grid-template-columns: 1fr 130px; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px dotted var(--paper-3); }
.cfg-row .lbl { font-size: 12.5px; }
.cfg-row .lbl small { color: var(--muted); display: block; font-size: 11px; }
.cfg-row input[type=number], .cfg-row select { width: 130px; }
.assume { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; background: #F6E3B8; color: #6E4B00; border-radius: 3px; padding: 0 4px; margin-left: 5px; vertical-align: 1px; }
.cfg-cols { columns: 2 340px; column-gap: 16px; }
.cfg-cols fieldset { break-inside: avoid; }
table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12px; }
table.data th, table.data td { padding: 3px 6px; border-bottom: 1px solid var(--paper-3); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { background: var(--paper-2); position: sticky; top: 0; font-weight: 600; }
table.data td.neg { color: var(--terracotta); }
.tablewrap { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.preset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; display: flex; flex-direction: column; gap: 4px; }
.preset b { font-size: 13.5px; }
.preset span { color: var(--muted); font-size: 12px; flex: 1; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-size: 11px; fill: var(--muted); }
.legendrow { display: flex; gap: 14px; font-size: 12px; margin: 4px 0; flex-wrap: wrap; }
.legendrow i { display: inline-block; width: 14px; height: 3px; vertical-align: 3px; margin-right: 5px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stat .k { color: var(--muted); font-size: 11.5px; }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kbd { font-family: ui-monospace, monospace; background: var(--paper-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
@media (max-width: 1180px) { aside { width: 300px; } .metric { padding: 2px 6px; } .metric .v { font-size: 13px; } }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <div class="brand">Haspot <span>Sim</span></div>
    <div class="hud" id="hud"></div>
  </div>
  <div class="toprow">
    <div class="toolbar">
      <button data-act="new" title="New game">New game</button>
      <button data-act="scenarios">Scenarios</button>
      <button data-act="config" title="Config (C)">Config</button>
      <button data-act="ledger">Ledger &amp; charts</button>
      <button data-act="mc">Monte Carlo</button>
      <button data-act="compare">Compare</button>
      <button data-act="save">Save</button>
      <button data-act="load">Load</button>
      <button data-act="help">Help</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map" aria-label="City map. Click a building to select it."></canvas>
    <div class="overlay" id="timebox"><div class="t" id="tmonth">Month 0</div><div class="sub" id="tsub"></div><div class="bar"><div id="tbar"></div></div></div>
    <div class="overlay" id="speedbox">
      <button data-speed="0" title="Pause (Space)">❚❚</button>
      <button data-speed="1" title="Real time: 1 minute = 1 month (1)">1×</button>
      <button data-speed="2" title="1 month every 5 s (2)">5 s</button>
      <button data-speed="3" title="1 month every second (3)">1 s</button>
      <button data-speed="4" title="Jump to month N (4)">⇥ N</button>
      <button id="nextbtn" title="Next month (N)">+1</button>
    </div>
    <div class="overlay" id="legend">
      <span><i style="background:var(--pharmacy)"></i>Pharmacy</span>
      <span><i style="background:var(--kirana)"></i>Kirana</span>
      <span><i style="background:var(--inst)"></i>Hospital / school / coaching / lab</span>
      <span><i style="background:#fff;border:2px solid var(--green)"></i>Screen live</span>
      <span><i style="background:#fff;border:2px solid var(--amber)"></i>Dark days</span>
      <span><i style="background:#fff;border:2px solid var(--terracotta)"></i>Failed</span>
      <span><i style="background:var(--marigold);border-radius:50%"></i>Hub</span>
    </div>
    <div class="overlay" id="hint"></div>
    <div class="overlay" id="tip"></div>
  </div>
  <aside>
    <section class="panel" id="selpanel"></section>
    <section class="panel" id="netpanel"></section>
    <section class="panel"><h3>Advertisers <span id="advcount"></span></h3><ul class="list" id="advlist"></ul></section>
    <section class="panel" style="flex:1"><h3>Event log</h3><ul class="list" id="log" style="max-height:none"></ul></section>
  </aside>
</main>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<input type="file" id="filein" accept=".json,.csv,application/json,text/csv" hidden>
<script id="engine">
/* Haspot Sim engine: pure functions, no DOM. Tested by test/engine.test.mjs in node:vm. */
var HaspotEngine = (function () {
  'use strict';

  // ---------- defaults (section 6) ----------
  var DEFAULTS = {
    mode: 'stochastic', // 'plan' | 'stochastic' | 'classic'
    kit: { tv: 10000, hotspot: 2150, power: 700, fitting: 800 },
    opex: { hostFee: 500, reserve: 300, licenceY1: 257, licenceY2: 147, data: 205, freeLicences: 2, hostPayFollowsUptime: true },
    feeRate: 0.0353,
    fixedBase: 5700,
    hubPer15: 300,
    start: {
      money: 117800, creditLimit: 100000, creditInterestMonthly: 0.015,
      setup: 'plan', // 'plan' = 10 pharmacy screens + 5 founders + spares + trip; 'empty' = nothing installed
      setupScreens: 10, setupFounders: 5, spareTVs: 1, spareHotspots: 2, tripCost: 12000,
      calendarStart: '2026-10'
    },
    growth: {
      salaryTopup: 40000, topupMonths: 12,
      expandWhenSold: 7, batch: 10, maxPerNetwork: 21, kiranaLaunchWhenPharmacyScreens: 20,
      autoExpand: true, preferZone: ''
    },
    hostPitch: { success: 0.40, hostSlotBonus: 0.10, cooldownMonths: 2 },
    loop: { slots: 12, sellable: 10, openHours: 12 },
    price: { list: 500, founding: 300, foundingMonths: 12, foundingPrepaidMonths: 3, halfSlot: 250, foundingCount: 5, byNetwork: { ph: 0, ki: 0 } }, // byNetwork: 0 = use list
    demand: {
      arrivalsPerNetwork: 1.0, elasticity: 1.5, networkSizeBoost: 0.0,
      churnMonthly: 0.05, churnNoReports: 0.10, reports: true, makeGood: true,
      halfShare: 0.0,       // share of arrivals that buy a half slot
      targetSold: 0,        // 0 = no cap beyond open slots; plan mode uses 8
      fixedArrivals: -1,    // -1 = Poisson; >= 0 = exactly this many per live network per month
      shockFromMonth: 0, shockArrivalsMult: 1, shockChurnMult: 1
    },
    anchors: {
      enabled: false, slotsPerNetwork: 5, price: 450, termMonths: 12, billing: 'quarterly',
      annualDiscount: 0.10, maxSlotsPerClient: 2, pitchSuccess: 0.25, exclusivityBonus: 0.10,
      renewProb: 0.70, seasonalWeighting: true, peakMonths: [1, 2, 3, 4], feeRate: 0, tdsRate: 0.02,
      autoPitchPerMonth: 1, cooldownMonths: 2
    },
    events: {
      tvFailMonthly: 0.010, hotspotFailMonthly: 0.020, unplugMonthly: 0.10, powerCutDaysMonthly: 3,
      restartFailProb: 0.0, hostQuitMonthly: 0.01, adRuleBreach: 0.002,
      spareSwapDays: 2, noSpareSwapDays: 10, restartDarkDays: 2
    },
    infra: {
      player: 'androidTV', connectivity: 'own4G', cms: 'cloud', cmsSwitchMonth: 13,
      piExtra: 7091, vpsMonthly: 600, selfHostedNeedsLicence: false, shopWifiHostFeeExtra: 100, sharedRange: 3
    },
    founder: {
      approveAd: 2, swap: 60, closeBase: 60, closePerScreen: 1, appsScript: false,
      weeklyReview: 30, anchorAccount: 20, pitch: 30, selfHostedExtra: 60, breach: 30
    },
    classic: { revenuePerScreen: 7000, expensePerScreen: 5000 }
  };

  var LEDGER_COLUMNS = ['month', 'screens_ph', 'screens_ki', 'slots_sold_ph', 'slots_sold_ki', 'revenue', 'gateway_fees',
    'host_fees', 'reserve', 'licences', 'data', 'fixed', 'interest', 'profit', 'cash', 'credit_used', 'uptime_pct',
    'founder_hours_week', 'anchors_active', 'monthly_advertisers'];

  var ZONES = [
    { id: 'lanka', name: 'Lanka (BHU gate)', footfall: 1.3, power: 1.0, x: 0, y: 0, w: 16, h: 14 },
    { id: 'sigra', name: 'Sigra', footfall: 1.2, power: 1.0, x: 16, y: 0, w: 16, h: 14 },
    { id: 'godowlia', name: 'Godowlia', footfall: 1.4, power: 1.6, x: 32, y: 0, w: 16, h: 14 },
    { id: 'cantt', name: 'Cantt', footfall: 1.0, power: 0.8, x: 0, y: 14, w: 24, h: 14 },
    { id: 'bhelupur', name: 'Bhelupur', footfall: 1.1, power: 1.0, x: 24, y: 14, w: 24, h: 14 }
  ];
  var GRID = { w: 48, h: 28, tile: 24 };
  var NETWORKS = ['ph', 'ki'];
  var NETWORK_NAMES = { ph: 'Pharmacy', ki: 'Kirana' };
  var INSTITUTION_TYPES = ['hospital', 'school', 'coaching', 'lab'];
  var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---------- presets (section 8) ----------
  var PRESETS = [
    { id: 'P0', name: 'Classic', seed: 1, question: 'The original toy rules',
      overrides: { mode: 'classic', start: { money: 100000, creditLimit: 50000, setup: 'empty' }, growth: { salaryTopup: 0, autoExpand: false } } },
    { id: 'P1', name: 'Plan, deterministic', seed: 1, question: 'Reproduces the business plan exactly',
      overrides: { mode: 'plan', start: { money: 0 } } },
    { id: 'P2', name: 'Base', seed: 1, question: 'What a normal launch looks like', overrides: {} },
    { id: 'P3', name: 'Anchor-led', seed: 1, question: 'Is the floor worth the lower top line?',
      overrides: { anchors: { enabled: true, slotsPerNetwork: 5, price: 450, billing: 'quarterly' } } },
    { id: 'P4', name: 'Bad year', seed: 1, question: 'How deep does cash go?',
      overrides: { demand: { shockFromMonth: 4, shockArrivalsMult: 0.5, shockChurnMult: 2 } } },
    { id: 'P5', name: 'Infra stress', seed: 1, question: 'What untested hardware costs',
      overrides: { growth: { preferZone: 'godowlia' }, events: { restartFailProb: 0.3, hotspotFailMonthly: 0.04 } } },
    { id: 'P6', name: 'Lean infra', seed: 1, question: 'Do the savings beat the extra downtime and hours?',
      overrides: { infra: { connectivity: 'shopWifi', cms: 'selfHosted', cmsSwitchMonth: 13 } } },
    { id: 'P7', name: 'Fast sales', seed: 1, question: 'Upside case', overrides: { demand: { arrivalsPerNetwork: 2.0 } } },
    { id: 'P8', name: 'No top-ups', seed: 1, question: 'Growth funded only by the business', overrides: { growth: { salaryTopup: 0 } } }
  ];

  // ---------- small utils ----------
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isObj(v) { return v && typeof v === 'object' && !Array.isArray(v); }
  function merge(base, over) {
    var out = clone(base);
    (function rec(t, s) {
      for (var k in s) {
        if (isObj(s[k]) && isObj(t[k])) rec(t[k], s[k]);
        else t[k] = clone(s[k]);
      }
    })(out, over || {});
    return out;
  }
  function makeParams(overrides) { return merge(DEFAULTS, overrides || {}); }
  function presetById(id) { for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].id === id) return PRESETS[i]; return null; }
  function presetParams(id) { var p = presetById(id); return makeParams(p ? p.overrides : {}); }
  function round(x) { return Math.round(x); }
  function round2(x) { return Math.round(x * 100) / 100; }
  function fmtINR(x) { var n = Math.round(x); return (n < 0 ? '−₹' : '₹') + Math.abs(n).toLocaleString('en-IN'); }

  // Plan mode (section 9.1) switches off every event and random draw.
  function effective(p) {
    if (p.mode !== 'plan') return p;
    var e = clone(p);
    for (var k in e.events) if (/Monthly$|Prob$|Breach$/.test(k)) e.events[k] = 0;
    e.demand.fixedArrivals = e.demand.fixedArrivals >= 0 ? e.demand.fixedArrivals : 1;
    e.demand.targetSold = 8;
    e.demand.churnMonthly = 0; e.demand.churnNoReports = 0; e.demand.halfShare = 0;
    e.demand.shockFromMonth = 0;
    e.opex.licenceY2 = e.opex.licenceY1;
    e.opex.freeLicences = 0;
    e.start.creditLimit = 1e15;
    e.start.creditInterestMonthly = 0;
    e.growth.autoExpand = true;
    e.anchors.enabled = false;
    return e;
  }

  // ---------- RNG: mulberry32, state kept in a plain object so state is JSON-serialisable ----------
  function rngNext(holder) {
    var t = (holder.rngState = (holder.rngState + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

    // 6. costs
    var hostFees = 0, reserve = 0, licences = 0, data = 0;
    var selfHosted = p.infra.cms === 'selfHosted' && M >= p.infra.cmsSwitchMonth;
    var licIndex = 0;
    actNow.forEach(function (sc) {
      if (classic) return;
      hostFees += p.opex.hostFee * (p.opex.hostPayFollowsUptime ? sc.uptimeShare : 1) + (sc.connectivity === 'shopWifi' ? p.infra.shopWifiHostFeeExtra : 0);
      reserve += p.opex.reserve;
      var age = M - sc.installedMonth - 1;
      var lic = age < 12 ? p.opex.licenceY1 : p.opex.licenceY2;
      if (selfHosted && !p.infra.selfHostedNeedsLicence) lic = 0;
      if (p.mode !== 'plan' && licIndex < p.opex.freeLicences) lic = 0;
      licIndex++;
      licences += lic;
      data += sc.connectivity === 'shopWifi' ? 0 : (sc.connectivity === 'sharedHotspot' && sc.paired ? p.opex.data / 2 : p.opex.data);
    });
    if (selfHosted && !classic) licences += p.infra.vpsMonthly;
    var nLive = actNow.length;
    var fixed = classic ? nLive * p.classic.expensePerScreen : fixedCost(p, nLive);
    var gateway = classic ? 0 : nonAnchorRev * p.feeRate + anchorRev * p.anchors.feeRate;
    var interest = Math.max(0, -cashBefore) * p.start.creditInterestMonthly;

    // 9 (folded in). repairs come out of the reserve fund first, then cash
    s.reserveFund += reserve;
    var fromFund = Math.min(s.reserveFund, repairCost);
    s.reserveFund -= fromFund;
    var overflow = repairCost - fromFund;
    reserve += overflow;
    // spares used this month are restocked; the replacement is already inside repairCost
    s.spares.tv += sparesUsed.tv; s.spares.hotspot += sparesUsed.hotspot;

    var costs = gateway + hostFees + reserve + licences + data + fixed + interest;
    var profit = revenue - costs;

    // 7. cash (anchors billed in advance, recognised monthly; TDS back once a year)
    var tdsBack = 0;
    s.tdsReceivable += anchorTds;
    if (M >= 15 && (M - 15) % 12 === 0 && s.tdsReceivable > 0) { tdsBack = s.tdsReceivable; s.tdsReceivable = 0; log(s, 'TDS refund received: ' + fmtINR(tdsBack) + '.', 'good'); }
    s.cash += topup + profit + (anchorBilled - anchorTds - anchorRev) + tdsBack;

    // 8. credit line / insolvency
    if (s.cash < -s.creditLimit) {
      var lines = { 'host fees': hostFees, 'fixed costs': fixed, 'licences': licences, 'data': data, 'hardware reserve and repairs': reserve, 'interest': interest };
      var big = Object.keys(lines).sort(function (a, b) { return lines[b] - lines[a]; })[0];
      s.insolvent = { month: M, cause: 'Cash need of ' + fmtINR(-s.cash) + ' went past the credit limit of ' + fmtINR(s.creditLimit) +
        '. This month: revenue ' + fmtINR(revenue) + ', costs ' + fmtINR(costs) + ' (largest: ' + big + ' ' + fmtINR(lines[big]) + ').' };
      log(s, 'INSOLVENT in month ' + M + ': ' + s.insolvent.cause, 'bad');
    }

    // 10. growth
    var gates = gateStatus(s, p);
    if (!s.insolvent && p.growth.autoExpand) minutes += autoExpand(s, p) * p.founder.pitch;

    // 11. founder minutes
    var nAnchors = s.advertisers.filter(function (a) { return a.kind === 'anchor'; }).length;
    if (!classic) {
      minutes += s.approvalsThisMonth * p.founder.approveAd + breaches * (p.founder.breach + p.founder.approveAd);
      minutes += p.founder.appsScript ? 30 + 0.5 * nLive : p.founder.closeBase + p.founder.closePerScreen * nLive;
      minutes += p.founder.weeklyReview * 4.3;
      minutes += nAnchors * p.founder.anchorAccount;
      if (selfHosted) minutes += p.founder.selfHostedExtra;
    }
    minutes += swaps * p.founder.swap + s.pitchesThisMonth * p.founder.pitch;
    s.approvalsThisMonth = 0; s.pitchesThisMonth = 0;

    var row = {
      month: M,
      screens_ph: s.screens.filter(function (x) { return x.network === 'ph'; }).length,
      screens_ki: s.screens.filter(function (x) { return x.network === 'ki'; }).length,
      slots_sold_ph: soldSlots(s, 'ph', true), slots_sold_ki: soldSlots(s, 'ki', true),
      revenue: round(revenue), gateway_fees: round(gateway), host_fees: round(hostFees), reserve: round(reserve),
      licences: round(licences), data: round(data), fixed: round(fixed), interest: round(interest),
      profit: round(profit), cash: round(s.cash), credit_used: round(Math.max(0, -s.cash)),
      uptime_pct: nLive ? Math.round(uptimeSum / nLive * 1000) / 10 : 100,
      founder_hours_week: round2(minutes / 60 / 4.3),
      anchors_active: nAnchors,
      monthly_advertisers: s.advertisers.filter(function (a) { return a.kind !== 'anchor'; }).length
    };
    s.ledger.push(row);

    // gate notices + concentration
    var notices = gates.slice();
    if (revenue > 0) for (var id in clientRev) if (clientRev[id] / revenue > 0.2) {
      var an = s.advertisers.filter(function (a) { return a.id === id; })[0];
      notices.push({ kind: 'warn', text: 'Concentration: ' + (an ? an.name : 'one client') + ' is ' + Math.round(clientRev[id] / revenue * 100) + '% of revenue' });
    }
    if (profit >= 100000 && !s.ledger.slice(0, -1).some(function (r) { return r.profit >= 100000; })) log(s, 'First month with net ≥ ₹1 lakh!', 'good');
    s.notices = notices;
    return row;
  }

  function gateStatus(s, p) {
    var out = [];
    NETWORKS.forEach(function (net) {
      var n = s.screens.filter(function (x) { return x.network === net; }).length;
      var sold = soldSlots(s, net, true);
      if (n > 0 && n < p.growth.maxPerNetwork && sold >= p.growth.expandWhenSold)
        out.push({ kind: 'gate', text: NETWORK_NAMES[net] + ' gate met: ' + sold + ' of ' + p.loop.sellable + ' sold' });
    });
    var ph = s.screens.filter(function (x) { return x.network === 'ph'; }).length;
    var ki = s.screens.filter(function (x) { return x.network === 'ki'; }).length;
    if (!ki && ph >= p.growth.kiranaLaunchWhenPharmacyScreens && soldSlots(s, 'ph', true) >= p.growth.expandWhenSold)
      out.push({ kind: 'gate', text: 'Kirana launch gate met' });
    return out;
  }

  // Section 9.1 expansion rule; returns number of new hosts.
  function autoExpand(s, p) {
    var added = 0;
    var kc = kitCost(p, p.infra.player);
    NETWORKS.forEach(function (net) {
      var type = net === 'ph' ? 'pharmacy' : 'kirana';
      var n = s.screens.filter(function (x) { return x.network === net; }).length;
      var sold = soldSlots(s, net, true);
      var add = 0;
      if (net === 'ki' && n === 0) {
        var phN = s.screens.filter(function (x) { return x.network === 'ph'; }).length;
        if (soldSlots(s, 'ph', true) >= p.growth.expandWhenSold && phN >= p.growth.kiranaLaunchWhenPharmacyScreens && s.cash >= p.growth.batch * kc) add = p.growth.batch;
      } else if (n > 0 && sold >= p.growth.expandWhenSold && n < p.growth.maxPerNetwork) {
        add = Math.min(p.growth.batch, p.growth.maxPerNetwork - n);
        if (s.cash < add * kc) add = 0;
      }
      if (!add) return;
      var hosts = pickHosts(s, p, type, add);
      hosts.forEach(function (shop) { shop.state = 'host'; addScreen(s, p, shop, s.month); s.cash -= kc; added++; });
      if (hosts.length) log(s, (n === 0 ? 'Launched ' : 'Expanded ') + NETWORK_NAMES[net] + ': +' + hosts.length + ' screens (' + fmtINR(hosts.length * kc) + ').', 'good');
    });
    return added;
  }

  function moveScreen(s, p, sc) {
    var old = shopById(s, sc.shopId);
    var cands = s.shops.filter(function (sh) { return sh.type === old.type && sh.zone === old.zone && sh.state === 'prospect' && !screenAt(s, sh.id); });
    if (!cands.length) cands = s.shops.filter(function (sh) { return sh.type === old.type && sh.state === 'prospect' && !screenAt(s, sh.id); });
    old.state = 'removed';
    if (s.hubShopId === old.id) s.hubShopId = null;
    if (!cands.length) {
      s.screens = s.screens.filter(function (x) { return x !== sc; });
      s.cash += kitCost(p, sc.player) * 0.5;
      log(s, old.name + ' ended the agreement; no new host available, screen sold.', 'bad');
      return;
    }
    var nu = cands[0];
    nu.state = 'host';
    sc.shopId = nu.id; sc.x = nu.x; sc.y = nu.y; sc.zone = nu.zone;
    log(s, old.name + ' ended the agreement; screen moved to ' + nu.name + ' (1 trip day).', 'warn');
  }

  function hasAnchor(s, instId, net) {
    return s.advertisers.some(function (a) { return a.kind === 'anchor' && a.instId === instId && a.network === net; });
  }

  // ---------- player actions ----------
  function fundsAvailable(s) { return s.cash + s.creditLimit; }

  function pitchHost(s, shopId, opts) {
    var p = effective(s.params);
    var shop = shopById(s, shopId);
    if (!shop) return { ok: false, reason: 'No such shop.' };
    if (shop.state !== 'prospect') return { ok: false, reason: shop.state === 'pitched' ? 'Cooling off until month ' + shop.cooldownUntil + '.' : 'Already a host.' };
    var offer = !!(opts && opts.offerHostSlot);
    var chance = p.hostPitch.success + (offer ? p.hostPitch.hostSlotBonus : 0);
    s.pitchesThisMonth++;
    if (rngNext(s) < chance) {
      shop.state = 'host'; shop.hostSlot = offer;
      log(s, shop.name + ' agreed to host a screen' + (offer ? ' (host slot offered)' : '') + '.', 'good');
      return { ok: true };
    }
    shop.state = 'pitched'; shop.cooldownUntil = s.month + p.hostPitch.cooldownMonths;
    log(s, shop.name + ' said no. Try again in ' + p.hostPitch.cooldownMonths + ' months.', 'warn');
    return { ok: false, reason: 'They said no. Cooling off for ' + p.hostPitch.cooldownMonths + ' months.' };
  }

  function installScreen(s, shopId, infra) {
    var p = effective(s.params);
    var shop = shopById(s, shopId);
    if (!shop || shop.kind !== 'shop') return { ok: false, reason: 'Not a shop.' };
    if (shop.state !== 'host') return { ok: false, reason: 'Pitch the shop first.' };
    if (screenAt(s, shopId)) return { ok: false, reason: 'Already has a screen.' };
    var player = (infra && infra.player) || p.infra.player;
    var cost = kitCost(p, player);
    if (fundsAvailable(s) < cost) return { ok: false, reason: 'Not enough money or credit (' + fmtINR(cost) + ' needed).' };
    s.cash -= cost;
    var sc = addScreen(s, p, shop, s.month, infra);
    log(s, 'Installed a screen at ' + shop.name + ' for ' + fmtINR(cost) + '; live next month.', 'good');
    return { ok: true, screen: sc };
  }

  function removeScreen(s, shopId) {
    var p = effective(s.params);
    var sc = screenAt(s, shopId);
    if (!sc) return { ok: false, reason: 'No screen here.' };
    var back = kitCost(p, sc.player) * 0.5;
    s.cash += back;
    s.screens = s.screens.filter(function (x) { return x !== sc; });
    log(s, 'Removed the screen at ' + shopById(s, shopId).name + '; resale ' + fmtINR(back) + '.', 'warn');
    return { ok: true };
  }

  function setHub(s, shopId) {
    var shop = shopById(s, shopId);
    if (!shop || shop.state !== 'host') return { ok: false, reason: 'Only a host shop can be the hub.' };
    s.hubShopId = shopId;
    log(s, shop.name + ' is now the hub shop (holds spares).');
    return { ok: true };
  }

  function buySpare(s, kind) {
    var p = effective(s.params);
    if (!s.hubShopId) return { ok: false, reason: 'Mark a hub shop first.' };
    var cost = kind === 'tv' ? p.kit.tv : p.kit.hotspot;
    if (fundsAvailable(s) < cost) return { ok: false, reason: 'Not enough money or credit.' };
    s.cash -= cost; s.spares[kind]++;
    log(s, 'Bought a spare ' + (kind === 'tv' ? 'TV' : 'hotspot') + ' for ' + fmtINR(cost) + '.');
    return { ok: true };
  }

  function anchorCheck(s, p, inst, form) {
    if (!p.anchors.enabled) return 'Anchor leases are off. Turn them on in Config → Anchor leases.';
    var net = form.network;
    if (!s.screens.some(function (x) { return x.network === net; })) return 'The ' + NETWORK_NAMES[net] + ' network has no screens yet.';
    if (form.slots < 1 || form.slots > p.anchors.maxSlotsPerClient) return 'One client can take at most ' + p.anchors.maxSlotsPerClient + ' slots.';
    if (anchorSlotsUsed(s, net) + form.slots > p.anchors.slotsPerNetwork) return 'Only ' + (p.anchors.slotsPerNetwork - anchorSlotsUsed(s, net)) + ' anchor slots left on ' + NETWORK_NAMES[net] + '.';
    if (hasAnchor(s, inst.id, net)) return inst.name + ' already has a lease on ' + NETWORK_NAMES[net] + '.';
    var clash = s.advertisers.filter(function (a) { return a.kind === 'anchor' && a.network === net && a.category === inst.category && (a.exclusive || form.exclusive); })[0];
    if (clash) return 'Exclusivity: ' + clash.name + ' already holds the ' + inst.category + ' category on ' + NETWORK_NAMES[net] + '.';
    if (inst.cooldownUntil > s.month) return 'They asked you to come back in month ' + inst.cooldownUntil + '.';
    return null;
  }

  function pitchAnchorCore(s, p, inst, form, startMonth) {
    var why = anchorCheck(s, p, inst, form);
    if (why) return { ok: false, reason: why };
    s.pitchesThisMonth++;
    var price = p.anchors.price * (form.billing === 'annual' ? 1 - p.anchors.annualDiscount : 1);
    var monthly = price * form.slots * activeScreensOrAll(s, form.network);
    if (monthly > inst.budgetMonthly) {
      inst.cooldownUntil = s.month + p.anchors.cooldownMonths;
      log(s, inst.name + ' liked it but ' + fmtINR(monthly) + '/month is over their ' + fmtINR(inst.budgetMonthly) + ' budget.', 'warn');
      return { ok: false, reason: 'Over their budget of ' + fmtINR(inst.budgetMonthly) + ' a month (' + fmtINR(monthly) + ' asked).' };
    }
    var chance = p.anchors.pitchSuccess + (form.exclusive ? p.anchors.exclusivityBonus : 0);
    if (rngNext(s) >= chance) {
      inst.cooldownUntil = s.month + p.anchors.cooldownMonths;
      log(s, inst.name + ' declined the anchor lease.', 'warn');
      return { ok: false, reason: 'They declined. Try again after month ' + inst.cooldownUntil + '.' };
    }
    var a = { id: 'a' + (s.nextId++), kind: 'anchor', network: form.network, instId: inst.id, name: inst.name, category: inst.category,
      slots: form.slots, rate: price, startMonth: startMonth, termMonths: form.termMonths, endMonth: startMonth + form.termMonths - 1,
      billing: form.billing, exclusive: !!form.exclusive, seasonal: !!form.seasonal, nextBillMonth: startMonth };
    s.advertisers.push(a);
    s.approvalsThisMonth++;
    log(s, 'Anchor lease signed: ' + inst.name + ', ' + form.slots + ' slot' + (form.slots > 1 ? 's' : '') + ' on ' + NETWORK_NAMES[form.network] + ', ' + form.termMonths + ' months, billed ' + form.billing + '.', 'good');
    return { ok: true, anchor: a };
  }
  function activeScreensOrAll(s, net) { return Math.max(1, s.screens.filter(function (x) { return x.network === net; }).length); }

  function pitchAnchor(s, instId, form) {
    var p = effective(s.params);
    var inst = instById(s, instId);
    if (!inst) return { ok: false, reason: 'No such institution.' };
    var f = { network: form.network || 'ph', slots: +form.slots || 1, termMonths: +form.termMonths || p.anchors.termMonths,
      billing: form.billing || p.anchors.billing, exclusive: !!form.exclusive,
      seasonal: form.seasonal != null ? !!form.seasonal : p.anchors.seasonalWeighting };
    return pitchAnchorCore(s, p, inst, f, s.month + 1);
  }

  // Slots an anchor actually plays this month (seasonal weighting for schools/coaching).
  function anchorPlaySlots(s, a) {
    var p = effective(s.params);
    if (!a.seasonal || (a.category !== 'school' && a.category !== 'coaching')) return a.slots;
    var cm = calendarMonth(p, Math.max(1, s.month));
    return p.anchors.peakMonths.indexOf(cm) >= 0 ? Math.min(2, Math.max(a.slots, 2)) : 1;
  }

  function setParam(s, path, value) {
    var parts = path.split('.'), o = s.params;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    var old = o[parts[parts.length - 1]];
    if (JSON.stringify(old) === JSON.stringify(value)) return;
    o[parts[parts.length - 1]] = value;
    if (path === 'start.creditLimit') s.creditLimit = effective(s.params).start.creditLimit;
    log(s, 'Changed ' + path + ' from ' + JSON.stringify(old) + ' to ' + JSON.stringify(value) + ' (takes effect next month).');
  }

  function runTo(s, month) { while (s.month < month && !s.insolvent) tick(s); return s; }

  function runScenario(params, months, opts) {
    var s = newGame(params, opts);
    runTo(s, months);
    return s;
  }

  // ---------- Monte Carlo (section 7.5) ----------
  function percentile(sorted, q) {
    if (!sorted.length) return NaN;
    var i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
  }
  function monteCarlo(params, opts) {
    opts = opts || {};
    var runs = opts.runs || 500, months = opts.months || 36, seed = opts.seed != null ? opts.seed : 1;
    var world = createWorld(opts.worldSeed != null ? opts.worldSeed : 7);
    var by18 = 0, by24 = 0, breached = 0, firstMonths = [], lowCash = [], hours24 = [];
    var profitByMonth = [], cashByMonth = [];
    for (var m = 0; m < months; m++) { profitByMonth.push([]); cashByMonth.push([]); }
    for (var i = 0; i < runs; i++) {
      var s = newGame(params, { seed: seed + i, world: world, worldSeed: opts.worldSeed });
      s.log = []; s.quiet = true; // no event text in batch runs
      var first = Infinity, low = s.cash;
      while (s.month < months && !s.insolvent) {
        var r = tick(s);
        if (r.profit >= 100000 && first === Infinity) first = r.month;
        if (r.cash < low) low = r.cash;
        profitByMonth[r.month - 1].push(r.profit);
        cashByMonth[r.month - 1].push(r.cash);
        if (r.month === 24) hours24.push(r.founder_hours_week);
      }
      if (s.insolvent) { breached++; low = Math.min(low, -s.creditLimit - 1); }
      if (first <= 18) by18++;
      if (first <= 24) by24++;
      firstMonths.push(first);
      lowCash.push(low);
    }
    var num = function (a, b) { return a - b; };
    firstMonths.sort(num); lowCash.sort(num); hours24.sort(num);
    var fan = profitByMonth.map(function (arr, k) {
      arr.sort(num);
      return { month: k + 1, n: arr.length, p10: percentile(arr, 0.1), p50: percentile(arr, 0.5), p90: percentile(arr, 0.9) };
    });
    var cashFan = cashByMonth.map(function (arr, k) {
      arr.sort(num);
      return { month: k + 1, n: arr.length, p10: percentile(arr, 0.1), p50: percentile(arr, 0.5), p90: percentile(arr, 0.9) };
    });
    var med = percentile(firstMonths, 0.5);
    return {
      runs: runs, months: months,
      pLakhBy18: by18 / runs, pLakhBy24: by24 / runs,
      medianMonthToLakh: isFinite(med) ? med : null,
      p5LowestCash: percentile(lowCash, 0.05),
      pCreditBreached: breached / runs,
      medianHoursAt24: hours24.length ? percentile(hours24, 0.5) : null,
      fan: fan, cashFan: cashFan
    };
  }

  // ---------- CSV / JSON ----------
  function ledgerToCSV(ledger) {
    var lines = [LEDGER_COLUMNS.join(',')];
    ledger.forEach(function (r) { lines.push(LEDGER_COLUMNS.map(function (c) { return r[c]; }).join(',')); });
    return lines.join('\n') + '\n';
  }
  function csvToLedger(text) {
    var lines = String(text).trim().split(/\r?\n/);
    var head = lines.shift().split(',');
    return lines.filter(Boolean).map(function (l) {
      var v = l.split(','), r = {};
      head.forEach(function (h, i) { r[h] = Number(v[i]); });
      return r;
    });
  }
  function exportState(s) { return JSON.stringify(s); }
  function importState(text) {
    var s = JSON.parse(text);
    if (!s || !s.params || !Array.isArray(s.ledger)) throw new Error('Not a Haspot Sim save file.');
    s.params = merge(DEFAULTS, s.params);
    return s;
  }

  return {
    DEFAULTS: DEFAULTS, PRESETS: PRESETS, ZONES: ZONES, GRID: GRID, LEDGER_COLUMNS: LEDGER_COLUMNS, NETWORK_NAMES: NETWORK_NAMES,
    makeParams: makeParams, presetParams: presetParams, presetById: presetById, effective: effective, merge: merge, clone: clone,
    createWorld: createWorld, newGame: newGame, tick: tick, runTo: runTo, runScenario: runScenario,
    pitchHost: pitchHost, installScreen: installScreen, removeScreen: removeScreen, setHub: setHub, buySpare: buySpare,
    pitchAnchor: pitchAnchor, anchorCheck: function (s, instId, form) { return anchorCheck(s, effective(s.params), instById(s, instId), form); },
    anchorPlaySlots: anchorPlaySlots, setParam: setParam, gateStatus: function (s) { return gateStatus(s, effective(s.params)); },
    kitCost: kitCost, opexPerScreen: opexPerScreen, fixedCost: fixedCost, perScreenMargin: perScreenMargin, screensFor: screensFor,
    paybackMonths: paybackMonths, steadyNet: steadyNet, calendarLabel: calendarLabel, calendarMonth: calendarMonth,
    soldSlots: soldSlots, anchorSlotsUsed: anchorSlotsUsed, openCapacity: function (s) { return openCapacity(s, effective(s.params)); },
    activeScreens: activeScreens, shopById: shopById, instById: instById, screenAt: screenAt, advMonthlyRate: advMonthlyRate,
    monteCarlo: monteCarlo, ledgerToCSV: ledgerToCSV, csvToLedger: csvToLedger, exportState: exportState, importState: importState,
    fmtINR: fmtINR, rngNext: rngNext
  };
})();
</script>
<script id="ui">
(function () {
  'use strict';
  var E = HaspotEngine;
  var $ = function (id) { return document.getElementById(id); };
  var fmt = E.fmtINR;
  var AUTOSAVE_KEY = 'haspot-sim-autosave-v1';
  var PERIOD = { 1: 60000, 2: 5000, 3: 1000 }; // ms per month by speed

  var S = null;            // game state
  var speed = 0, acc = 0, lastTs = 0;
  var selected = null;     // { kind: 'shop'|'inst', id }
  var netTab = 'ph';
  var view = { scale: 1, ox: 0, oy: 0 };
  var dirty = true;
  var selMsg = null;       // { text, cls } shown under the selection panel
  var hover = null;

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function P() { return E.effective(S.params); }
  function lastRow() { return S.ledger[S.ledger.length - 1] || null; }
  function compact(v) {
    var a = Math.abs(v), sg = v < 0 ? '−' : '';
    if (a >= 1e7) return sg + '₹' + (a / 1e7).toFixed(1) + 'Cr';
    if (a >= 1e5) return sg + '₹' + (a / 1e5).toFixed(a >= 1e6 ? 0 : 1) + 'L';
    if (a >= 1e3) return sg + '₹' + Math.round(a / 1e3) + 'k';

  // ---------- charts (inline SVG) ----------
  function chart(opts) {
    var w = opts.w || 680, h = opts.h || 230, L = 64, R = 12, Tm = 12, B = 26;
    var all = [0];
    opts.series.forEach(function (s) { s.values.forEach(function (v) { if (v != null && isFinite(v)) all.push(v); }); });
    (opts.bands || []).forEach(function (b) { b.lo.concat(b.hi).forEach(function (v) { if (v != null && isFinite(v)) all.push(v); }); });
    var n = Math.max.apply(null, opts.series.map(function (s) { return s.values.length; }).concat([2]));
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi === lo) hi = lo + 1;
    var step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    var X = function (i) { return L + (i / Math.max(1, n - 1)) * (w - L - R); };
    var Y = function (v) { return Tm + (1 - (v - lo) / (hi - lo)) * (h - Tm - B); };
    var out = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opts.title || 'chart') + '">';
    for (var v = lo; v <= hi + 1e-9; v += step) {
      out += '<line x1="' + L + '" x2="' + (w - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + (Math.abs(v) < 1e-9 ? '#14231F' : '#E1D6C1') + '" stroke-width="' + (Math.abs(v) < 1e-9 ? 1.2 : 1) + '"/>';
      out += '<text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + compact(v) + '</text>';
    }
    for (var i = 0; i < n; i++) if ((i + 1) % 6 === 0 || i === 0) out += '<text x="' + X(i) + '" y="' + (h - 8) + '" text-anchor="middle">m' + (i + 1) + '</text>';
    if (opts.refLine != null && opts.refLine >= lo && opts.refLine <= hi) out += '<line x1="' + L + '" x2="' + (w - R) + '" y1="' + Y(opts.refLine) + '" y2="' + Y(opts.refLine) + '" stroke="#2F7D4F" stroke-dasharray="4 4"/><text x="' + (w - R) + '" y="' + (Y(opts.refLine) - 4) + '" text-anchor="end" style="fill:#2F7D4F">₹1 lakh net</text>';
    (opts.bands || []).forEach(function (b) {
      var pts = [];
      b.hi.forEach(function (v, i) { if (v != null && isFinite(v)) pts.push(X(i) + ',' + Y(v)); });
      for (var k = b.lo.length - 1; k >= 0; k--) if (b.lo[k] != null && isFinite(b.lo[k])) pts.push(X(k) + ',' + Y(b.lo[k]));
      out += '<polygon points="' + pts.join(' ') + '" fill="' + b.color + '" opacity="0.28"/>';
    });
    opts.series.forEach(function (s) {
      var d = '';
      s.values.forEach(function (v, i) { if (v == null || !isFinite(v)) return; d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
      out += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.2"' + (s.dash ? ' stroke-dasharray="6 4"' : '') + '/>';
    });
    return out + '</svg>';
  }
  function niceStep(raw) { var p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9)))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
  function legend(items) { return '<div class="legendrow">' + items.map(function (it) { return '<span><i style="background:' + it[1] + (it[2] ? ';background:repeating-linear-gradient(90deg,' + it[1] + ' 0 5px,transparent 5px 8px)' : '') + '"></i>' + esc(it[0]) + '</span>'; }).join('') + '</div>'; }

  function ledgerTable(ledger) {
    var cols = E.LEDGER_COLUMNS;
    return '<div class="tablewrap"><table class="data"><thead><tr>' + cols.map(function (c) { return '<th>' + c.replace(/_/g, ' ') + '</th>'; }).join('') + '</tr></thead><tbody>' +
      ledger.map(function (r) {
        return '<tr>' + cols.map(function (c) {
          var v = r[c], money = ['revenue', 'gateway_fees', 'host_fees', 'reserve', 'licences', 'data', 'fixed', 'interest', 'profit', 'cash', 'credit_used'].indexOf(c) >= 0;
          return '<td class="' + (money && v < 0 ? 'neg' : '') + '">' + (money ? Math.round(v).toLocaleString('en-IN') : v) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  function ledgerModal(imported) {
    var L = imported || S.ledger;
    var same = imported ? JSON.stringify(imported) === JSON.stringify(E.csvToLedger(E.ledgerToCSV(S.ledger))) : null;
    openModal('<h2>' + (imported ? 'Imported ledger' : 'Ledger & charts') + '</h2>' +
      (imported ? '<div class="msg ' + (same ? 'good' : '') + '">' + (same ? 'This CSV matches the current game\'s ledger row for row.' : 'Showing the imported CSV (it differs from the current game).') + '</div>' : '<p class="lede">One row per month. CSV columns are in the order the plan specifies.</p>') +
      (L.length ? chart({ title: 'Cash and net profit by month', series: [{ values: L.map(function (r) { return r.cash; }), color: '#14231F' }, { values: L.map(function (r) { return r.profit; }), color: '#E9A23B' }], refLine: 100000 }) +
        legend([['Cash (negative = credit used)', '#14231F'], ['Net profit / mo', '#E9A23B']]) + ledgerTable(L) : '<p class="empty">No months played yet. Press N to advance one month.</p>') +
      '<div class="foot"><button data-m="import">Import CSV…</button><button data-m="csv"' + (S.ledger.length ? '' : ' disabled') + '>Export CSV</button><button class="primary" data-m="close">Close</button></div>', true);
    bindModal({ close: closeModal, csv: function () { download('haspot-ledger-seed' + S.seed + '-m' + S.month + '.csv', E.ledgerToCSV(S.ledger), 'text/csv'); }, import: function () { pickFile(); } });
  }

  function gameOverModal() {
    openModal('<h2 style="color:var(--terracotta)">Insolvent in month ' + S.insolvent.month + '</h2><p class="lede">' + esc(S.insolvent.cause) + '</p>' +
      chart({ title: 'Cash and net profit', series: [{ values: S.ledger.map(function (r) { return r.cash; }), color: '#14231F' }, { values: S.ledger.map(function (r) { return r.profit; }), color: '#B5523B' }] }) +
      legend([['Cash', '#14231F'], ['Net profit / mo', '#B5523B']]) + ledgerTable(S.ledger) +
      '<div class="foot"><button data-m="csv">Export CSV</button><button data-m="view">Look at the map</button><button class="primary" data-m="new">New game</button></div>', true);
    bindModal({ csv: function () { download('haspot-ledger-insolvent.csv', E.ledgerToCSV(S.ledger), 'text/csv'); }, view: closeModal, new: startModal });
  }

  function sourceOptions(sel) {
    return '<option value="current"' + (sel === 'current' ? ' selected' : '') + '>Current game\'s settings</option>' +
      E.PRESETS.map(function (pr) { return '<option value="' + pr.id + '"' + (sel === pr.id ? ' selected' : '') + '>' + pr.id + ' · ' + esc(pr.name) + '</option>'; }).join('');
  }
  function sourceParams(v) { return v === 'current' ? E.clone(S.params) : E.presetParams(v); }
  function sourceName(v) { return v === 'current' ? 'Current game' : v + ' · ' + E.presetById(v).name; }

  function mcStats(mc) {
    return [
      ['P(net ≥ ₹1 lakh by month 18)', pct(mc.pLakhBy18)], ['P(by month 24)', pct(mc.pLakhBy24)],
      ['Median month to ₹1 lakh', mc.medianMonthToLakh == null ? 'not reached' : 'month ' + Math.round(mc.medianMonthToLakh)],
      ['5th-percentile lowest cash', fmt(mc.p5LowestCash)], ['P(credit limit breached)', pct(mc.pCreditBreached)],
      ['Median founder hours / week at m24', mc.medianHoursAt24 == null ? '—' : mc.medianHoursAt24.toFixed(1)]
    ];
  }
  function mcModal(preset) {
    var src = preset || 'current';
    openModal('<h2>Monte Carlo</h2><p class="lede">Runs the scenario many times with seeds seed, seed+1, … at instant speed and reports the odds. Starts from month 0 of the scenario.</p>' +
      '<div class="row"><label>Scenario</label><select id="mcSrc">' + sourceOptions(src) + '</select><label>Runs</label><input type="number" id="mcRuns" value="500" min="10" max="5000"><label>Months</label><input type="number" id="mcMonths" value="36" min="6" max="120"><label>Seed</label><input type="number" id="mcSeed" value="1"></div>' +
      '<div class="row"><label><input type="checkbox" id="mcAuto" checked> Auto-expand by the plan rules during runs</label></div>' +
      '<div id="mcOut"><p class="empty">Press Run.</p></div><div class="foot"><button data-m="close">Close</button><button class="primary" data-m="run">Run</button></div>', true);
    bindModal({
      close: closeModal,
      run: function () {
        $('mcOut').innerHTML = '<p class="empty">Running…</p>';
        setTimeout(function () {
          var p = sourceParams($('mcSrc').value);
          if ($('mcAuto').checked) p.growth.autoExpand = true;
          var t0 = performance.now();
          var mc = E.monteCarlo(p, { runs: +$('mcRuns').value || 500, months: +$('mcMonths').value || 36, seed: +$('mcSeed').value || 1, worldSeed: S ? S.worldSeed : 7 });
          var ms = Math.round(performance.now() - t0);
          var warn = p.start.setup === 'empty' && !(E.effective(p).mode === 'classic') ? '<div class="msg">This scenario starts with an empty map, so auto-expand has nothing to grow from. Pick a preset or start a game with the plan kit.</div>' : '';
          $('mcOut').innerHTML = warn + '<div class="stats">' + mcStats(mc).map(function (s) { return '<div class="stat"><div class="k">' + s[0] + '</div><div class="v">' + s[1] + '</div></div>'; }).join('') + '</div>' +
            '<div class="loopkey">' + mc.runs + ' runs × ' + mc.months + ' months in ' + ms + ' ms.</div>' +
            '<h3 style="margin:10px 0 2px">Net profit by month</h3>' +
            chart({ title: 'Monte Carlo fan of net profit', series: [{ values: mc.fan.map(function (f) { return f.p50; }), color: '#8A5A0B' }], bands: [{ lo: mc.fan.map(function (f) { return f.p10; }), hi: mc.fan.map(function (f) { return f.p90; }), color: '#E9A23B' }], refLine: 100000 }) +
            legend([['Median', '#8A5A0B'], ['10th–90th percentile', '#E9A23B']]) +
            '<h3 style="margin:10px 0 2px">Cash by month</h3>' +
            chart({ title: 'Monte Carlo fan of cash', h: 190, series: [{ values: mc.cashFan.map(function (f) { return f.p50; }), color: '#14231F' }], bands: [{ lo: mc.cashFan.map(function (f) { return f.p10; }), hi: mc.cashFan.map(function (f) { return f.p90; }), color: '#5B6863' }] }) +
            legend([['Median cash', '#14231F'], ['10th–90th percentile', '#5B6863']]);
        }, 20);
      }
    });
  }

  function compareModal() {
    openModal('<h2>Compare</h2><p class="lede">Runs both scenarios as Monte Carlo batches and plots the median cash and net profit over the months, with the odds side by side.</p>' +
      '<div class="row"><label>A</label><select id="cmpA">' + sourceOptions('P3') + '</select><label>B</label><select id="cmpB">' + sourceOptions('P4') + '</select>' +
      '<label>Runs</label><input type="number" id="cmpRuns" value="500"><label>Months</label><input type="number" id="cmpMonths" value="36"></div>' +
      '<div id="cmpOut"><p class="empty">Press Run.</p></div><div class="foot"><button data-m="close">Close</button><button class="primary" data-m="run">Run</button></div>', true);
    bindModal({
      close: closeModal,
      run: function () {
        $('cmpOut').innerHTML = '<p class="empty">Running…</p>';
        setTimeout(function () {
          var a = $('cmpA').value, b = $('cmpB').value, runs = +$('cmpRuns').value || 500, months = +$('cmpMonths').value || 36;
          var pa = sourceParams(a), pb = sourceParams(b); pa.growth.autoExpand = true; pb.growth.autoExpand = true;
          var ws = S ? S.worldSeed : 7;
          var A = E.monteCarlo(pa, { runs: runs, months: months, worldSeed: ws }), B = E.monteCarlo(pb, { runs: runs, months: months, worldSeed: ws });
          var sa = mcStats(A), sb = mcStats(B);
          $('cmpOut').innerHTML =
            '<h3 style="margin:6px 0 2px">Net profit by month (median)</h3>' +
            chart({ title: 'Net profit, A vs B', series: [{ values: A.fan.map(function (f) { return f.p50; }), color: '#14231F' }, { values: B.fan.map(function (f) { return f.p50; }), color: '#B5523B', dash: true }], refLine: 100000 }) +
            legend([['A: ' + sourceName(a), '#14231F'], ['B: ' + sourceName(b), '#B5523B', true]]) +
            '<h3 style="margin:10px 0 2px">Cash by month (median)</h3>' +
            chart({ title: 'Cash, A vs B', h: 190, series: [{ values: A.cashFan.map(function (f) { return f.p50; }), color: '#14231F' }, { values: B.cashFan.map(function (f) { return f.p50; }), color: '#B5523B', dash: true }] }) +
            '<div class="grid2" style="margin-top:10px">' + [[a, sa], [b, sb]].map(function (x, k) {
              return '<div><h3 style="margin:0 0 4px">' + (k ? 'B' : 'A') + ': ' + esc(sourceName(x[0])) + '</h3><table class="data"><tbody>' + x[1].map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table></div>';
            }).join('') + '</div>';
        }, 20);
      }
    });
  }

  function helpModal() {
    openModal('<h2>How to play</h2><p class="lede">Haspot Sim turns the business plan into a map. Place screens in shops, sell 10-second slots, and watch cash, profit, risk and your own hours.</p>' +
      '<ol><li>Click a pale <b>pharmacy</b> (teal) or <b>kirana</b> (brown) and <b>Pitch host</b>. Offering the host slot raises the odds.</li>' +
      '<li>When a shop says yes, <b>Install screen</b>. It pays the kit cost now and goes live next month.</li>' +
      '<li>Advertisers arrive month by month once a network has live screens. The first five are founders at ₹300, three months prepaid.</li>' +
      '<li>Mark one host as the <b>hub shop</b> and buy spares: a spare TV turns a 10-day outage into 2 days.</li>' +
      '<li>Hospitals (H), schools (S), coaching (C) and labs (L) take <b>anchor leases</b> (turn them on in Config).</li>' +
      '<li>Watch the gate chips: when a network has 7 of 10 slots sold, it is time to add screens.</li></ol>' +
      '<p><span class="kbd">Space</span> pause / play · <span class="kbd">1</span> real time (1 minute = 1 month) · <span class="kbd">2</span> 1 month / 5 s · <span class="kbd">3</span> 1 month / s · <span class="kbd">4</span> jump to month N · <span class="kbd">N</span> next month · <span class="kbd">C</span> config · <span class="kbd">Esc</span> close. Drag to pan, scroll to zoom.</p>' +
      '<p class="loopkey">Everything runs in this file, offline. Your game autosaves in this browser; use Save for a file you can keep.</p>' +
      '<div class="foot"><button class="primary" data-m="close">Close</button></div>');
    bindModal({ close: closeModal });
  }

  // ---------- files ----------
  function download(name, text, type) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function pickFile() { $('filein').value = ''; $('filein').click(); }
  $('filein').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return;
    f.text().then(function (txt) {
      try {
        if (/\.csv$/i.test(f.name) || /^month,/.test(txt)) { ledgerModal(E.csvToLedger(txt)); return; }
        var st = E.importState(txt); closeModal(); startGame(st);
        S.log.unshift({ month: S.month, text: 'Loaded ' + f.name + '.', kind: 'info' }); renderAll();
      } catch (e) { alert('Could not read that file: ' + e.message); }
    });
  });

  // ---------- toolbar, speed, keys ----------
  document.querySelector('.toolbar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var a = b.dataset.act;
    if (a === 'new') startModal();
    if (a === 'scenarios') scenarioModal();
    if (!S) return;
    if (a === 'config') configModal();
    if (a === 'ledger') ledgerModal();
    if (a === 'mc') mcModal(S.presetId || 'current');
    if (a === 'compare') compareModal();
    if (a === 'save') download('haspot-save-seed' + S.seed + '-m' + S.month + '.json', E.exportState(S), 'application/json');
    if (a === 'load') pickFile();
    if (a === 'help') helpModal();
  });
  $('speedbox').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !S) return;
    if (b.id === 'nextbtn') { doTick(); renderAll(); return; }
    setSpeed(+b.dataset.speed);
  });
  var lastSpeed = 1;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOpen() && S) { closeModal(); return; }
    if (modalOpen() || !S) return;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === ' ') { e.preventDefault(); if (speed) { lastSpeed = speed; setSpeed(0); } else setSpeed(S.insolvent ? 0 : lastSpeed); }
    else if (e.key >= '1' && e.key <= '4') setSpeed(+e.key);
    else if (e.key === 'n' || e.key === 'N') { doTick(); renderAll(); }
    else if (e.key === 'c' || e.key === 'C') configModal();
  });

  // ---------- boot ----------
  resize();
  requestAnimationFrame(frame);
  startModal();
  // a game is needed behind the start modal so the map is not blank
  S = E.newGame(E.makeParams({ start: { setup: 'empty' }, growth: { autoExpand: false } }), { seed: 1 });
  fitView(); renderAll();
  window.HaspotUI = { get state() { return S; }, tick: function () { doTick(); renderAll(); }, startGame: startGame };
})();
</script>
</body>
</html>
