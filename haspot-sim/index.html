<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haspot Sim</title>
<style>
:root {
  --ink: #14231F; --ink-2: #2B3D38; --paper: #F6F1E7; --paper-2: #ECE4D4; --paper-3: #E1D6C1;
  --marigold: #E9A23B; --marigold-ink: #8A5A0B; --terracotta: #B5523B; --green: #2F7D4F; --amber: #C98A12;
  --muted: #5B6863; --line: #CDBFA6; --pharmacy: #2E7D6B; --kirana: #8C6A33; --inst: #4A5A8C;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); }
body { display: flex; flex-direction: column; min-width: 1024px; font-size: 13px; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--ink); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button.primary:hover:not(:disabled) { background: var(--ink-2); }
button.accent { background: var(--marigold); border-color: var(--marigold); color: var(--ink); font-weight: 600; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--marigold); outline-offset: 1px; }
input[type=number], input[type=text], select { background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
input[type=number] { width: 110px; }

header { background: var(--ink); color: var(--paper); padding: 6px 12px 6px; display: flex; flex-direction: column; gap: 5px; }
.toprow { display: flex; align-items: center; gap: 14px; }
.brand { font-weight: 700; letter-spacing: .3px; font-size: 15px; white-space: nowrap; }
.brand span { color: var(--marigold); }
.hud { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
.metric { padding: 2px 9px; border-left: 1px solid #33473F; min-width: 0; }
.metric:first-child { border-left: 0; }
.metric .k { font-size: 10.5px; color: #B9C3BD; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
.metric .v { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric .v.neg { color: #F08A70; }
.metric .v.pos { color: #9BD7AE; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
.toolbar button { background: transparent; color: var(--paper); border-color: #3D534A; padding: 3px 9px; }
.toolbar button:hover { border-color: var(--marigold); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 20px; align-items: center; }
.chip { font-size: 11.5px; border-radius: 999px; padding: 2px 9px; background: #23372F; color: var(--paper); border: 1px solid #3D534A; }
.chip.gate { background: var(--marigold); color: var(--ink); border-color: var(--marigold); font-weight: 600; }
.chip.warn { background: var(--terracotta); color: #fff; border-color: var(--terracotta); }
.chip.muted { background: transparent; color: #B9C3BD; border-color: transparent; padding-left: 0; }

main { flex: 1; display: flex; min-height: 0; }
#mapwrap { flex: 1; position: relative; min-width: 0; background: var(--paper-2); overflow: hidden; }
#map { display: block; width: 100%; height: 100%; cursor: grab; }
#map.dragging { cursor: grabbing; }
.overlay { position: absolute; background: rgba(20,35,31,.92); color: var(--paper); border-radius: 8px; padding: 7px 11px; }
/* ---- shell: tabs, time, views ---- */
.spacer { flex: 1; }
.maintabs { display: flex; gap: 4px; background: #0D1915; padding: 3px; border-radius: 9px; }
.maintabs button { background: transparent; border: 0; color: #B9C3BD; padding: 5px 14px; border-radius: 7px; font-weight: 600; }
.maintabs button.on { background: var(--paper); color: var(--ink); }
.maintabs button:hover:not(.on) { color: var(--paper); }
#timebox { min-width: 170px; text-align: right; }
#timebox .t { font-size: 15px; font-weight: 700; }
#timebox .sub { font-size: 11px; color: #B9C3BD; }
#timebox .bar { margin-top: 3px; }
#speedbox { display: flex; gap: 4px; align-items: center; }
#speedbox button { background: transparent; color: var(--paper); border-color: #3D534A; padding: 4px 9px; }
#speedbox button.on { background: var(--marigold); color: var(--ink); border-color: var(--marigold); font-weight: 700; }
#speedbox .accentbtn { background: var(--marigold); color: var(--ink); border-color: var(--marigold); font-weight: 700; }
.rtoggle { color: #B9C3BD; font-size: 12px; display: flex; align-items: center; gap: 5px; margin-left: 6px; }
header .hud { display: none; }
body.tab-map header .hud { display: flex; }
.view { display: none; flex: 1; min-width: 0; min-height: 0; }
.view.on { display: flex; }
#view-dash, #view-analysis { overflow-y: auto; background: var(--paper-2); }

/* ---- dashboard ---- */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; padding: 16px; width: 100%; max-width: 1500px; margin: 0 auto; align-content: start; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 1250px) { .c3, .c4, .c5 { grid-column: span 6; } .c7, .c8 { grid-column: span 12; } .c6 { grid-column: span 12; } }
.card { background: #FFFDF8; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.card h2 { margin: 0 0 2px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hero .big { font-size: 22px; font-weight: 750; }
.hero .small { color: #B9C3BD; margin-top: 2px; }
.hero .grow { flex: 1; min-width: 240px; }
.hero button { background: transparent; color: var(--paper); border-color: #3D534A; }
.hero button.accent { background: var(--marigold); color: var(--ink); border-color: var(--marigold); }
.tiles { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1250px) { .tiles { grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); } .dash .goalcard { grid-column: span 12; } }
.tile { background: #FFFDF8; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 8px; min-width: 0; }
.tile .k { color: var(--muted); font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 21px; font-weight: 750; font-variant-numeric: tabular-nums; margin: 2px 0 0; white-space: nowrap; }
.tile .d { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; min-height: 15px; }
.d.up { color: #1E6B3F; } .d.down { color: #9A3A24; } .d.flat { color: var(--muted); }
.tile svg { display: block; width: 100%; height: 30px; margin-top: 4px; }
.ringwrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.ringwrap svg { width: 150px; height: 150px; flex: none; }
.ringwrap .facts { flex: 1; min-width: 150px; }
.facts .row2 { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dotted var(--paper-3); gap: 8px; }
.facts .row2 span:last-child { font-weight: 650; font-variant-numeric: tabular-nums; }
.status { margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: var(--paper-2); font-weight: 600; }
.status.good { background: #D5EBDD; color: #1E5534; }
.meter { height: 12px; background: var(--paper-3); border-radius: 6px; position: relative; overflow: visible; margin: 6px 0 4px; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--green); }
.meter > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.meterlbl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.netrow { padding: 8px 0; border-bottom: 1px solid var(--paper-3); }
.netrow:last-child { border-bottom: 0; }
.netrow .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.netrow .name { font-weight: 700; font-size: 14px; }
.blocks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 6px; }
.blocks i { height: 16px; border-radius: 4px; background: #fff; border: 1px dashed var(--line); }
.blocks i.f { background: var(--green); border: 0; }
.blocks i.a { background: var(--marigold); border: 0; }
.pill { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--paper-2); color: var(--muted); white-space: nowrap; }
.pill.go { background: var(--marigold); color: var(--ink); }
.pill.ok { background: #D5EBDD; color: #1E5534; }
.pill.bad { background: #F2D3CB; color: #7A2A17; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.dots i { width: 13px; height: 13px; border-radius: 50%; display: block; }
.st-live { background: #2F7D4F; } .st-dark { background: #C98A12; } .st-failed { background: #B5523B; } .st-pending { background: #fff; border: 2px solid #8C9690; }
.legendmini { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legendmini span { display: inline-flex; align-items: center; gap: 5px; }
.legendmini i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legendmini i.sq { border-radius: 2px; width: 12px; height: 12px; }
.hbar { display: grid; grid-template-columns: 120px 1fr 70px; gap: 8px; align-items: center; padding: 3px 0; font-size: 12.5px; }
.hbar .tr { height: 14px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.hbar .tr i { display: block; height: 100%; background: #eb6834; border-radius: 0 4px 4px 0; }
.hbar span:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; background: #fff; }
.badge .ic { width: 38px; height: 38px; border-radius: 50%; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--paper-3); color: #8C9690; }
.badge.on .ic { background: var(--marigold); color: var(--ink); }
.badge .bt { font-weight: 700; font-size: 12px; }
.badge .bs { font-size: 11px; color: var(--muted); }
.badge:not(.on) { opacity: .75; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px dotted var(--paper-3); font-size: 12.5px; }
.feed li .m { color: var(--muted); font-weight: 600; min-width: 30px; }
.feed li .ic { width: 18px; height: 18px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; background: #8C9690; }
.feed li.good .ic { background: #2F7D4F; } .feed li.warn .ic { background: #C98A12; } .feed li.bad .ic { background: #B5523B; }
.tipcard { background: #FFF6E3; border-color: #E9C98B; }
.tipcard .tiptext { font-size: 15px; font-weight: 650; margin: 6px 0 10px; line-height: 1.35; }
.emptycard { color: var(--muted); padding: 18px 0; text-align: center; }
.emptycard button { margin-top: 8px; }
.legendrow.small { font-size: 11.5px; color: var(--muted); }

/* tooltip, toasts */
#dtip { position: fixed; z-index: 30; pointer-events: none; display: none; background: var(--ink); color: var(--paper); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 260px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: pop .45s cubic-bezier(.2,1.6,.4,1); max-width: 320px; }
.toast .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--marigold); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 17px; flex: none; }
.toast small { display: block; color: #B9C3BD; }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .3s; }
@keyframes pop { from { transform: scale(.6) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* report card */
.stars { color: var(--marigold-ink); font-size: 20px; letter-spacing: 2px; }
.rc-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
.rc-grid h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.kpis3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis3 div { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.kpis3 b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.kpis3 b.neg { color: var(--terracotta); }
.kpis3 span { font-size: 11px; color: var(--muted); }

/* scenario lab */
.lab-progress { height: 8px; background: var(--paper-3); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.lab-progress i { display: block; height: 100%; width: 0; background: #2a78d6; transition: width .2s; }
table.heat { border-collapse: separate; border-spacing: 3px; width: 100%; font-size: 12.5px; }
table.heat th { font-weight: 600; color: var(--muted); text-align: left; padding: 4px 6px; }
table.heat td { text-align: center; padding: 8px 4px; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
table.heat td.rowh { text-align: left; font-weight: 700; background: transparent; color: var(--ink); }
table.heat td.best { outline: 2px solid var(--ink); outline-offset: -2px; }
.scgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.plan ol { margin: 6px 0 0; padding-left: 20px; }
.plan ol li { margin: 5px 0; line-height: 1.4; }
.plan .why { background: var(--paper-2); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.rankrow { display: grid; grid-template-columns: 26px 1fr 90px 90px 90px; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px dotted var(--paper-3); font-size: 12.5px; }
.rankrow.h { color: var(--muted); font-weight: 600; font-size: 11.5px; }
.rankrow span:nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }
.rankrow .n { width: 22px; height: 22px; border-radius: 50%; background: var(--paper-3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11.5px; }
.rankrow.top .n { background: var(--marigold); }
#legend { bottom: 10px; left: 10px; font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 20px); }
#legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
#tip { pointer-events: none; display: none; font-size: 12px; max-width: 240px; }
#hint { bottom: 44px; left: 10px; font-size: 12px; background: var(--marigold); color: var(--ink); display: none; }

aside { width: 350px; border-left: 1px solid var(--line); background: var(--paper); overflow-y: auto; display: flex; flex-direction: column; }
section.panel { padding: 10px 12px; border-bottom: 1px solid var(--line); }
section.panel h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.empty { color: var(--muted); font-style: italic; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0; }
.kv div:nth-child(odd) { color: var(--muted); }
.kv div:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.row { display: flex; gap: 8px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
.row label { color: var(--muted); }
.title { font-size: 15px; font-weight: 700; }
.tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px; background: var(--paper-3); margin-left: 4px; vertical-align: 1px; }
.tag.live { background: #D5EBDD; color: #1E5534; }
.tag.dark { background: #F6E3B8; color: #6E4B00; }
.tag.failed { background: #F2D3CB; color: #7A2A17; }
.msg { margin-top: 6px; font-size: 12px; padding: 5px 8px; border-radius: 5px; background: var(--paper-2); }
.msg.bad { background: #F2D3CB; color: #6B2414; }
.msg.good { background: #D5EBDD; color: #1E5534; }
.tabs { display: flex; gap: 4px; }
.tabs button { padding: 2px 8px; font-size: 12px; }
.tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.loop { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 8px 0 4px; }
.loop div { height: 28px; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.slot-host { background: var(--paper-3); color: var(--ink); }
.slot-house { background: var(--ink-2); color: var(--paper); }
.slot-sold { background: var(--green); color: #fff; }
.slot-half { background: linear-gradient(90deg, var(--green) 50%, #fff 50%); color: var(--ink); border: 1px solid var(--green); }
.slot-anchor { background: var(--marigold); color: var(--ink); }
.slot-open { background: #fff; border: 1px dashed var(--line); color: var(--muted); }
.loopkey { font-size: 11px; color: var(--muted); }
ul.list { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; }
ul.list li { padding: 3px 0; border-bottom: 1px dotted var(--line); display: flex; justify-content: space-between; gap: 8px; }
ul.list li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
#log li { display: block; }
#log li b { color: var(--muted); font-weight: 600; margin-right: 4px; }
#log li.good { color: #1E5534; } #log li.bad { color: #7A2A17; } #log li.warn { color: #6E4B00; }

.modal-bg { position: fixed; inset: 0; background: rgba(20,35,31,.55); display: none; align-items: flex-start; justify-content: center; z-index: 10; padding: 40px 16px; overflow-y: auto; }
.modal-bg.open { display: flex; }
.modal { background: var(--paper); border-radius: 10px; width: min(760px, 100%); padding: 18px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.modal.wide { width: min(1080px, 100%); }
.modal h2 { margin: 0 0 4px; font-size: 19px; }
.modal .lede { color: var(--muted); margin: 0 0 12px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.field label { display: block; font-weight: 600; margin-bottom: 3px; }
.field .note { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 8px 12px 10px; }
legend { font-weight: 700; padding: 0 4px; }
.cfg-row { display: grid; grid-template-columns: 1fr 130px; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px dotted var(--paper-3); }
.cfg-row .lbl { font-size: 12.5px; }
.cfg-row .lbl small { color: var(--muted); display: block; font-size: 11px; }
.cfg-row input[type=number], .cfg-row select { width: 130px; }
.assume { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; background: #F6E3B8; color: #6E4B00; border-radius: 3px; padding: 0 4px; margin-left: 5px; vertical-align: 1px; }
.cfg-cols { columns: 2 340px; column-gap: 16px; }
.cfg-cols fieldset { break-inside: avoid; }
table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12px; }
table.data th, table.data td { padding: 3px 6px; border-bottom: 1px solid var(--paper-3); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { background: var(--paper-2); position: sticky; top: 0; font-weight: 600; }
table.data td.neg { color: var(--terracotta); }
.tablewrap { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.preset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; display: flex; flex-direction: column; gap: 4px; }
.preset b { font-size: 13.5px; }
.preset span { color: var(--muted); font-size: 12px; flex: 1; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-size: 11px; fill: var(--muted); }
.legendrow { display: flex; gap: 14px; font-size: 12px; margin: 4px 0; flex-wrap: wrap; }
.legendrow i { display: inline-block; width: 14px; height: 3px; vertical-align: 3px; margin-right: 5px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stat .k { color: var(--muted); font-size: 11.5px; }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kbd { font-family: ui-monospace, monospace; background: var(--paper-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
@media (max-width: 1180px) { aside { width: 300px; } .metric { padding: 2px 6px; } .metric .v { font-size: 13px; } }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <div class="brand">Haspot <span>Sim</span></div>
    <nav class="maintabs" role="tablist">
      <button data-tab="dash" role="tab">Dashboard</button>
      <button data-tab="map" role="tab">City map</button>
      <button data-tab="analysis" role="tab">Scenario lab</button>
    </nav>
    <div class="spacer"></div>
    <div id="timebox"><div class="t" id="tmonth">Month 0</div><div class="sub" id="tsub"></div><div class="bar"><div id="tbar"></div></div></div>
    <div id="speedbox">
      <button data-speed="0" title="Pause (Space)">❚❚</button>
      <button data-speed="1" title="Real time: 1 minute = 1 month (1)">1×</button>
      <button data-speed="2" title="1 month every 5 s (2)">5 s</button>
      <button data-speed="3" title="1 month every second (3)">1 s</button>
      <button data-speed="4" title="Jump to month N (4)">⇥ N</button>
      <button id="nextbtn" class="accentbtn" title="Next month (N)">Next month ▸</button>
    </div>
  </div>
  <div class="toprow">
    <div class="toolbar">
      <button data-act="new" title="New game">New game</button>
      <button data-act="scenarios">Scenarios</button>
      <button data-act="config" title="Config (C)">Config</button>
      <button data-act="ledger">Ledger</button>
      <button data-act="save">Save</button>
      <button data-act="load">Load</button>
      <button data-act="help">Help</button>
      <label class="rtoggle"><input type="checkbox" id="reportToggle"> Report after each month</label>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="hud" id="hud"></div>
</header>
<main>
 <div class="view" id="view-dash"></div>
 <div class="view" id="view-map">
  <div id="mapwrap">
    <canvas id="map" aria-label="City map. Click a building to select it."></canvas>
    <div class="overlay" id="legend">
      <span><i style="background:var(--pharmacy)"></i>Pharmacy</span>
      <span><i style="background:var(--kirana)"></i>Kirana</span>
      <span><i style="background:var(--inst)"></i>Hospital / school / coaching / lab</span>
      <span><i style="background:#fff;border:2px solid var(--green)"></i>Screen live</span>
      <span><i style="background:#fff;border:2px solid var(--amber)"></i>Dark days</span>
      <span><i style="background:#fff;border:2px solid var(--terracotta)"></i>Failed</span>
      <span><i style="background:var(--marigold);border-radius:50%"></i>Hub</span>
    </div>
    <div class="overlay" id="hint"></div>
    <div class="overlay" id="tip"></div>
  </div>
  <aside>
    <section class="panel" id="selpanel"></section>
    <section class="panel" id="netpanel"></section>
    <section class="panel"><h3>Advertisers <span id="advcount"></span></h3><ul class="list" id="advlist"></ul></section>
    <section class="panel" style="flex:1"><h3>Event log</h3><ul class="list" id="log" style="max-height:none"></ul></section>
  </aside>
 </div>
 <div class="view" id="view-analysis"></div>
</main>
<div id="dtip" role="tooltip"></div>
<div id="toasts" aria-live="polite"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<input type="file" id="filein" accept=".json,.csv,application/json,text/csv" hidden>
<script id="engine">
/* Haspot Sim engine: pure functions, no DOM. Tested by test/engine.test.mjs in node:vm. */
var HaspotEngine = (function () {
  'use strict';

  // ---------- defaults (section 6) ----------
  var DEFAULTS = {
    mode: 'stochastic', // 'plan' | 'stochastic' | 'classic'
    kit: { tv: 10000, hotspot: 2150, power: 700, fitting: 800 },
    opex: { hostFee: 500, reserve: 300, licenceY1: 257, licenceY2: 147, data: 205, freeLicences: 2, hostPayFollowsUptime: true },
    feeRate: 0.0353,
    fixedBase: 5700,
    hubPer15: 300,
    start: {
      money: 117800, creditLimit: 100000, creditInterestMonthly: 0.015,
      setup: 'plan', // 'plan' = 10 pharmacy screens + 5 founders + spares + trip; 'empty' = nothing installed
      setupScreens: 10, setupFounders: 5, spareTVs: 1, spareHotspots: 2, tripCost: 12000,
      calendarStart: '2026-10'
    },
    growth: {
      salaryTopup: 40000, topupMonths: 12,
      expandWhenSold: 7, batch: 10, maxPerNetwork: 21, kiranaLaunchWhenPharmacyScreens: 20,
      autoExpand: true, preferZone: ''
    },
    hostPitch: { success: 0.40, hostSlotBonus: 0.10, cooldownMonths: 2 },
    loop: { slots: 12, sellable: 10, openHours: 12 },
    price: { list: 500, founding: 300, foundingMonths: 12, foundingPrepaidMonths: 3, halfSlot: 250, foundingCount: 5, byNetwork: { ph: 0, ki: 0 } }, // byNetwork: 0 = use list
    demand: {
      arrivalsPerNetwork: 1.0, elasticity: 1.5, networkSizeBoost: 0.0,
      churnMonthly: 0.05, churnNoReports: 0.10, reports: true, makeGood: true,
      halfShare: 0.0,       // share of arrivals that buy a half slot
      targetSold: 0,        // 0 = no cap beyond open slots; plan mode uses 8
      fixedArrivals: -1,    // -1 = Poisson; >= 0 = exactly this many per live network per month
      shockFromMonth: 0, shockMonths: 0, shockArrivalsMult: 1, shockChurnMult: 1 // shockMonths 0 = never recovers
    },
    anchors: {
      enabled: false, slotsPerNetwork: 5, price: 450, termMonths: 12, billing: 'quarterly',
      annualDiscount: 0.10, maxSlotsPerClient: 2, pitchSuccess: 0.25, exclusivityBonus: 0.10,
      renewProb: 0.70, seasonalWeighting: true, peakMonths: [1, 2, 3, 4], feeRate: 0, tdsRate: 0.02,
      autoPitchPerMonth: 1, cooldownMonths: 2
    },
    events: {
      tvFailMonthly: 0.010, hotspotFailMonthly: 0.020, unplugMonthly: 0.10, powerCutDaysMonthly: 3,
      restartFailProb: 0.0, hostQuitMonthly: 0.01, adRuleBreach: 0.002,
      spareSwapDays: 2, noSpareSwapDays: 10, restartDarkDays: 2
    },
    infra: {
      player: 'androidTV', connectivity: 'own4G', cms: 'cloud', cmsSwitchMonth: 13,
      piExtra: 7091, vpsMonthly: 600, selfHostedNeedsLicence: false, shopWifiHostFeeExtra: 100, sharedRange: 3
    },
    founder: {
      approveAd: 2, swap: 60, closeBase: 60, closePerScreen: 1, appsScript: false,
      weeklyReview: 30, anchorAccount: 20, pitch: 30, selfHostedExtra: 60, breach: 30
    },
    classic: { revenuePerScreen: 7000, expensePerScreen: 5000 }
  };

  var LEDGER_COLUMNS = ['month', 'screens_ph', 'screens_ki', 'slots_sold_ph', 'slots_sold_ki', 'revenue', 'gateway_fees',
    'host_fees', 'reserve', 'licences', 'data', 'fixed', 'interest', 'profit', 'cash', 'credit_used', 'uptime_pct',
    'founder_hours_week', 'anchors_active', 'monthly_advertisers'];

  var ZONES = [
    { id: 'lanka', name: 'Lanka (BHU gate)', footfall: 1.3, power: 1.0, x: 0, y: 0, w: 16, h: 14 },
    { id: 'sigra', name: 'Sigra', footfall: 1.2, power: 1.0, x: 16, y: 0, w: 16, h: 14 },
    { id: 'godowlia', name: 'Godowlia', footfall: 1.4, power: 1.6, x: 32, y: 0, w: 16, h: 14 },
    { id: 'cantt', name: 'Cantt', footfall: 1.0, power: 0.8, x: 0, y: 14, w: 24, h: 14 },
    { id: 'bhelupur', name: 'Bhelupur', footfall: 1.1, power: 1.0, x: 24, y: 14, w: 24, h: 14 }
  ];
  var GRID = { w: 48, h: 28, tile: 24 };
  var NETWORKS = ['ph', 'ki'];
  var NETWORK_NAMES = { ph: 'Pharmacy', ki: 'Kirana' };
  var INSTITUTION_TYPES = ['hospital', 'school', 'coaching', 'lab'];
  var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---------- presets (section 8) ----------
  var PRESETS = [
    { id: 'P0', name: 'Classic', seed: 1, question: 'The original toy rules',
      overrides: { mode: 'classic', start: { money: 100000, creditLimit: 50000, setup: 'empty' }, growth: { salaryTopup: 0, autoExpand: false } } },
    { id: 'P1', name: 'Plan, deterministic', seed: 1, question: 'Reproduces the business plan exactly',
      overrides: { mode: 'plan', start: { money: 0 } } },
    { id: 'P2', name: 'Base', seed: 1, question: 'What a normal launch looks like', overrides: {} },
    { id: 'P3', name: 'Anchor-led', seed: 1, question: 'Is the floor worth the lower top line?',
      overrides: { anchors: { enabled: true, slotsPerNetwork: 5, price: 450, billing: 'quarterly' } } },
    { id: 'P4', name: 'Bad year', seed: 1, question: 'How deep does cash go?',
      overrides: { demand: { shockFromMonth: 4, shockArrivalsMult: 0.5, shockChurnMult: 2 } } },
    { id: 'P5', name: 'Infra stress', seed: 1, question: 'What untested hardware costs',
      overrides: { growth: { preferZone: 'godowlia' }, events: { restartFailProb: 0.3, hotspotFailMonthly: 0.04 } } },
    { id: 'P6', name: 'Lean infra', seed: 1, question: 'Do the savings beat the extra downtime and hours?',
      overrides: { infra: { connectivity: 'shopWifi', cms: 'selfHosted', cmsSwitchMonth: 13 } } },
    { id: 'P7', name: 'Fast sales', seed: 1, question: 'Upside case', overrides: { demand: { arrivalsPerNetwork: 2.0 } } },
    { id: 'P8', name: 'No top-ups', seed: 1, question: 'Growth funded only by the business', overrides: { growth: { salaryTopup: 0 } } }
  ];

  // ---------- small utils ----------
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isObj(v) { return v && typeof v === 'object' && !Array.isArray(v); }
  function merge(base, over) {
    var out = clone(base);
    (function rec(t, s) {
      for (var k in s) {
        if (isObj(s[k]) && isObj(t[k])) rec(t[k], s[k]);
        else t[k] = clone(s[k]);
      }
    })(out, over || {});
    return out;
  }
  function makeParams(overrides) { return merge(DEFAULTS, overrides || {}); }
  function presetById(id) { for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].id === id) return PRESETS[i]; return null; }
  function presetParams(id) { var p = presetById(id); return makeParams(p ? p.overrides : {}); }
  function round(x) { return Math.round(x); }
  function round2(x) { return Math.round(x * 100) / 100; }
  function fmtINR(x) { var n = Math.round(x); return (n < 0 ? '−₹' : '₹') + Math.abs(n).toLocaleString('en-IN'); }

  // Plan mode (section 9.1) switches off every event and random draw.
  function effective(p) {
    if (p.mode !== 'plan') return p;
    var e = clone(p);
    for (var k in e.events) if (/Monthly$|Prob$|Breach$/.test(k)) e.events[k] = 0;
    e.demand.fixedArrivals = e.demand.fixedArrivals >= 0 ? e.demand.fixedArrivals : 1;
    e.demand.targetSold = 8;
    e.demand.churnMonthly = 0; e.demand.churnNoReports = 0; e.demand.halfShare = 0;
    e.demand.shockFromMonth = 0;
    e.opex.licenceY2 = e.opex.licenceY1;
    e.opex.freeLicences = 0;
    e.start.creditLimit = 1e15;
    e.start.creditInterestMonthly = 0;
    e.growth.autoExpand = true;
    e.anchors.enabled = false;
    return e;
  }

  // ---------- RNG: mulberry32, state kept in a plain object so state is JSON-serialisable ----------
  function rngNext(holder) {
    var t = (holder.rngState = (holder.rngState + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rngInt(h, lo, hi) { return lo + Math.floor(rngNext(h) * (hi - lo + 1)); }
  function rngRange(h, lo, hi) { return lo + rngNext(h) * (hi - lo); }
  function poisson(h, lambda) {
    if (lambda <= 0) return 0;
    var L = Math.exp(-lambda), k = 0, q = 1;
    do { k++; q *= rngNext(h); } while (q > L && k < 1000);
    return k - 1;
  }
  function shuffle(h, a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rngNext(h) * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // ---------- money helpers ----------
  function kitCost(p, player) {
    return p.kit.tv + p.kit.hotspot + p.kit.power + p.kit.fitting + (player === 'pi' ? p.infra.piExtra : 0);
  }
  function listPrice(p, net) { return (p.price.byNetwork && p.price.byNetwork[net] > 0) ? p.price.byNetwork[net] : p.price.list; }
  function opexPerScreen(p) { return p.opex.hostFee + p.opex.reserve + p.opex.licenceY1 + p.opex.data; }
  function fixedCost(p, n) {
    if (p.mode === 'classic') return 0;
    return p.fixedBase + p.hubPer15 * Math.ceil(Math.max(n, 1) / 15);
  }
  function perScreenMargin(p, slots) { return slots * p.price.list * (1 - p.feeRate) - opexPerScreen(p); }
  function screensFor(p, target, slots) {
    var m = perScreenMargin(p, slots);
    if (m <= 0) return Infinity;
    for (var n = 1; n < 100000; n++) if (n * m - fixedCost(p, n) >= target) return n;
    return Infinity;
  }
  function paybackMonths(p, slots) { return kitCost(p, p.infra.player) / perScreenMargin(p, slots); }
  // Steady-state monthly net with n screens (9.2), no events.
  function steadyNet(p, n, openSold, anchorSlots) {
    return openSold * p.price.list * n * (1 - p.feeRate) + (anchorSlots || 0) * p.anchors.price * n * (1 - p.anchors.feeRate)
      - n * opexPerScreen(p) - fixedCost(p, n);
  }
  function calendarLabel(p, month) {
    var parts = String(p.start.calendarStart || '2026-10').split('-');
    var y = +parts[0], m0 = +parts[1] - 1 + Math.max(month, 1) - 1;
    return MONTH_NAMES[m0 % 12] + ' ' + (y + Math.floor(m0 / 12));
  }
  function calendarMonth(p, month) { // 1..12
    var parts = String(p.start.calendarStart || '2026-10').split('-');
    return ((+parts[1] - 1 + month - 1) % 12) + 1;
  }

  // ---------- world (section 5) ----------
  var PH_NAMES = ['Shiv', 'Ganga', 'Kashi', 'Sai', 'Jai Ambe', 'Om', 'Shree Ram', 'Vishwanath', 'Annapurna', 'Sankat Mochan', 'Durga', 'Mahavir', 'Sanjeevani', 'Apollo', 'Life Care', 'New'];
  var KI_NAMES = ['Gupta', 'Agrawal', 'Jaiswal', 'Yadav', 'Maurya', 'Kesari', 'Pandey', 'Sahu', 'Mishra', 'Verma', 'Tiwari', 'Singh', 'Chaurasia', 'Bansal', 'Pathak', 'Rai'];
  var INST_NAMES = {
    hospital: ['City Hospital', 'Heritage Hospital', 'Sun Hospital', 'Ganga Care', 'Aastha Hospital'],
    school: ['Sunbeam School', 'St. Mary\'s', 'DPS Branch', 'Saraswati Vidya', 'Little Flower'],
    coaching: ['Pathfinder Classes', 'Aakash Point', 'Toppers Academy', 'Vidya Coaching', 'Career Plus'],
    lab: ['Path Lab', 'Diagnostics Hub', 'Pathkind Centre', 'City Labs', 'Scan Point']
  };

  function roadsFor(h, from, to) {
    var lines = [], x = from + rngInt(h, 2, 4);
    while (x < to - 1) { lines.push(x); x += rngInt(h, 6, 8); }
    return lines;
  }

  function createWorld(worldSeed) {
    var h = { rngState: (worldSeed | 0) ^ 0x5bd1e995 };
    var road = [];
    for (var y = 0; y < GRID.h; y++) { road.push([]); for (var x = 0; x < GRID.w; x++) road[y].push(0); }
    var vx = roadsFor(h, 0, GRID.w), hy = roadsFor(h, 0, GRID.h);
    vx.forEach(function (c) { for (var y = 0; y < GRID.h; y++) road[y][c] = 1; });
    hy.forEach(function (r) { for (var x = 0; x < GRID.w; x++) road[r][x] = 1; });
    var occ = road.map(function (row) { return row.slice(); });
    var shops = [], institutions = [], nid = 1;
    function zoneAt(x, y) { for (var i = 0; i < ZONES.length; i++) { var z = ZONES[i]; if (x >= z.x && x < z.x + z.w && y >= z.y && y < z.y + z.h) return z; } return ZONES[0]; }
    function nearRoad(x, y, w, hh) {
      for (var yy = y - 1; yy <= y + hh; yy++) for (var xx = x - 1; xx <= x + w; xx++) {
        if (yy < 0 || xx < 0 || yy >= GRID.h || xx >= GRID.w) continue;
        var inside = xx >= x && xx < x + w && yy >= y && yy < y + hh;
        if (!inside && road[yy][xx]) return true;
      }
      return false;
    }
    function free(z, x, y, w, hh) {
      if (x + w > z.x + z.w || y + hh > z.y + z.h) return false;
      for (var yy = y; yy < y + hh; yy++) for (var xx = x; xx < x + w; xx++) if (occ[yy][xx]) return false;
      return true;
    }
    function candidates(z, w, hh) {
      var c = [];
      for (var y = z.y; y < z.y + z.h; y++) for (var x = z.x; x < z.x + z.w; x++) if (free(z, x, y, w, hh) && nearRoad(x, y, w, hh)) c.push([x, y]);
      return shuffle(h, c);
    }
    function place(z, w, hh) {
      var c = candidates(z, w, hh);
      for (var i = 0; i < c.length; i++) {
        var x = c[i][0], y = c[i][1];
        if (free(z, x, y, w, hh)) { for (var yy = y; yy < y + hh; yy++) for (var xx = x; xx < x + w; xx++) occ[yy][xx] = 2; return [x, y]; }
      }
      return null;
    }
    ZONES.forEach(function (z) {
      INSTITUTION_TYPES.forEach(function (t) {
        var n = rngInt(h, 1, 3);
        for (var i = 0; i < n; i++) {
          var pos = place(z, 2, 2); if (!pos) continue;
          var names = INST_NAMES[t];
          institutions.push({ id: 'i' + (nid++), kind: 'institution', type: t, category: t, zone: z.id, x: pos[0], y: pos[1], w: 2, h: 2,
            name: names[rngInt(h, 0, names.length - 1)] + ', ' + z.name.split(' ')[0],
            budgetMonthly: Math.round(rngRange(h, 10000, 60000) / 500) * 500, cooldownUntil: 0 });
        }
      });
      [['pharmacy', 6, 10, 120, 260, PH_NAMES, ' Medical'], ['kirana', 10, 16, 180, 400, KI_NAMES, ' Kirana']].forEach(function (spec) {
        var n = rngInt(h, spec[1], spec[2]);
        for (var i = 0; i < n; i++) {
          var pos = place(z, 1, 1); if (!pos) continue;
          shops.push({ id: 's' + (nid++), kind: 'shop', type: spec[0], zone: z.id, x: pos[0], y: pos[1], w: 1, h: 1,
            name: spec[5][rngInt(h, 0, spec[5].length - 1)] + spec[6],
            footfall: Math.round(rngRange(h, spec[3], spec[4]) * z.footfall),
            hasInverter: rngNext(h) < 0.5, wifiQuality: round2(rngNext(h)), hostReliability: round2(rngRange(h, 0.85, 0.98)),
            state: 'prospect', cooldownUntil: 0, hostSlot: false });
        }
      });
    });
    return { grid: GRID, road: road, zones: ZONES, shops: shops, institutions: institutions };
  }

  // ---------- state ----------
  function newGame(params, opts) {
    opts = opts || {};
    var p = clone(params);
    var seed = opts.seed != null ? opts.seed : 1;
    var worldSeed = opts.worldSeed != null ? opts.worldSeed : 7;
    var world = opts.world ? clone(opts.world) : createWorld(worldSeed);
    var s = {
      version: 1, month: 0, seed: seed, worldSeed: worldSeed, rngState: (seed * 2654435761) | 0,
      params: p, cash: 0, creditLimit: 0, reserveFund: 0, tdsReceivable: 0,
      screens: [], shops: world.shops, institutions: world.institutions, road: world.road,
      advertisers: [], spares: { tv: 0, hotspot: 0 }, hubShopId: null,
      foundersSigned: 0, nextId: 1, pitchesThisMonth: 0, approvalsThisMonth: 0,
      ledger: [], log: [], insolvent: null, notices: []
    };
    var e = effective(p);
    s.creditLimit = e.start.creditLimit;
    s.cash = e.start.money;
    if (e.start.setup === 'plan') {
      var hosts = pickHosts(s, e, 'pharmacy', e.start.setupScreens);
      hosts.forEach(function (shop) { shop.state = 'host'; addScreen(s, e, shop, 0); s.cash -= kitCost(e, e.infra.player); });
      if (hosts.length) s.hubShopId = hosts[0].id;
      s.spares.tv = e.start.spareTVs; s.spares.hotspot = e.start.spareHotspots;
      s.cash -= e.start.spareTVs * e.kit.tv + e.start.spareHotspots * e.kit.hotspot + e.start.tripCost;
      if (e.mode !== 'classic') {
        for (var i = 0; i < e.start.setupFounders; i++) {
          var adv = signAdvertiser(s, e, 'ph', 'founding', 1, 1);
          s.cash += adv.prepaidCash;
        }
      }
    }
    log(s, 'Game started: ' + (e.mode === 'plan' ? 'plan mode' : e.mode) + ', cash ' + fmtINR(s.cash) + ', credit limit ' + (s.creditLimit >= 1e14 ? 'unlimited' : fmtINR(s.creditLimit)) + '.');
    return s;
  }

  function log(s, text, kind) { if (s.quiet) return; s.log.unshift({ month: s.month, text: text, kind: kind || 'info' }); if (s.log.length > 400) s.log.length = 400; }
  function shopById(s, id) {
    var idx = s._shopIdx;
    if (!idx || idx.n !== s.shops.length || idx.ref !== s.shops) {
      idx = { n: s.shops.length, ref: s.shops, map: {} };
      for (var i = 0; i < s.shops.length; i++) idx.map[s.shops[i].id] = s.shops[i];
      Object.defineProperty(s, '_shopIdx', { value: idx, writable: true, configurable: true, enumerable: false });
    }
    return idx.map[id] || null;
  }
  function instById(s, id) { for (var i = 0; i < s.institutions.length; i++) if (s.institutions[i].id === id) return s.institutions[i]; return null; }
  function screenAt(s, shopId) { for (var i = 0; i < s.screens.length; i++) if (s.screens[i].shopId === shopId) return s.screens[i]; return null; }
  function netOf(type) { return type === 'pharmacy' ? 'ph' : 'ki'; }
  function zoneById(id) { for (var i = 0; i < ZONES.length; i++) if (ZONES[i].id === id) return ZONES[i]; return ZONES[0]; }

  function pickHosts(s, p, type, n) {
    var pref = p.growth.preferZone;
    var c = s.shops.filter(function (sh) { return sh.type === type && (sh.state === 'prospect' || sh.state === 'host') && !screenAt(s, sh.id); });
    c.sort(function (a, b) {
      var pa = a.zone === pref ? 1 : 0, pb = b.zone === pref ? 1 : 0;
      if (pa !== pb) return pb - pa;
      var ha = a.state === 'host' ? 1 : 0, hb = b.state === 'host' ? 1 : 0;
      if (ha !== hb) return hb - ha;
      return b.footfall - a.footfall || (a.id < b.id ? -1 : 1);
    });
    return c.slice(0, n);
  }

  function addScreen(s, p, shop, month, infra) {
    infra = infra || {};
    var sc = { id: 'sc' + (s.nextId++), shopId: shop.id, network: netOf(shop.type), installedMonth: month,
      player: infra.player || p.infra.player, connectivity: infra.connectivity || p.infra.connectivity,
      status: 'live', darkDaysThisMonth: 0, uptimeShare: 1, x: shop.x, y: shop.y, zone: shop.zone, paired: false };
    s.screens.push(sc);
    return sc;
  }

  function activeScreens(s, net) {
    return s.screens.filter(function (sc) { return sc.installedMonth < s.month && (!net || sc.network === net); });
  }

  // kind: 'founding' | 'list' | 'half'
  function signAdvertiser(s, p, net, kind, startMonth, screensNow) {
    var slots = kind === 'half' ? 0.5 : 1;
    var adv = { id: 'a' + (s.nextId++), network: net, kind: kind, slots: slots, startMonth: startMonth,
      endMonth: null, prepaidUntil: 0, lockedUntil: 0, rate: kind === 'half' ? p.price.halfSlot : listPrice(p, net),
      category: ['clinic', 'coaching', 'retail', 'food', 'services'][s.nextId % 5], prepaidCash: 0 };
    if (kind === 'founding') {
      adv.rate = p.price.founding;
      adv.lockedUntil = startMonth + p.price.foundingMonths - 1;
      adv.prepaidUntil = startMonth + p.price.foundingPrepaidMonths - 1;
      var n = net === 'ph' && s.month === 0 ? p.start.setupScreens : (screensNow || 0);
      adv.prepaidCash = adv.rate * n * p.price.foundingPrepaidMonths;
      s.foundersSigned++;
    }
    s.advertisers.push(adv);
    s.approvalsThisMonth++;
    return adv;
  }

  function advMonthlyRate(p, adv, month) {
    if (adv.kind === 'founding' && month > adv.lockedUntil) return listPrice(p, adv.network) * adv.slots;
    if (adv.kind === 'anchor') return adv.rate * adv.slots;
    if (adv.kind === 'half') return adv.rate;
    return adv.rate * adv.slots;
  }

  function soldSlots(s, net, includeAnchors) {
    var t = 0;
    s.advertisers.forEach(function (a) { if (a.network === net && (includeAnchors || a.kind !== 'anchor')) t += a.slots; });
    return t;
  }
  function anchorSlotsUsed(s, net) {
    var t = 0; s.advertisers.forEach(function (a) { if (a.network === net && a.kind === 'anchor') t += a.slots; }); return t;
  }
  function openCapacity(s, p) {
    var cap = p.loop.sellable - (p.anchors.enabled ? p.anchors.slotsPerNetwork : 0);
    if (p.demand.targetSold > 0) cap = Math.min(cap, p.demand.targetSold);
    return cap;
  }

  // ---------- the monthly tick (section 7.2) ----------
  function tick(s) {
    if (s.insolvent) return null;
    var p = effective(s.params);
    var classic = p.mode === 'classic';
    var cashBefore = s.cash;
    s.month += 1;
    var M = s.month;
    var minutes = 0, swaps = 0, breaches = 0;
    var topup = M <= p.growth.topupMonths ? p.growth.salaryTopup : 0;

    // 1b. institutions/shops cooldowns
    s.shops.forEach(function (sh) { if (sh.state === 'pitched' && sh.cooldownUntil <= M) sh.state = 'prospect'; });

    // 2. events per active screen
    var act = activeScreens(s);
    var repairCost = 0;
    var sparesUsed = { tv: 0, hotspot: 0 };
    var swapDaysTV = function () {
      if (s.hubShopId && s.spares.tv > 0) { s.spares.tv--; sparesUsed.tv++; return p.events.spareSwapDays; }
      return p.events.noSpareSwapDays;
    };
    var quitters = [];
    act.forEach(function (sc) {
      var shop = shopById(s, sc.shopId);
      var zone = zoneById(sc.zone);
      var dark = 0;
      sc.tvFailed = false;
      // TV failure
      if (rngNext(s) < p.events.tvFailMonthly) {
        var hadSpare = s.hubShopId && s.spares.tv > 0;
        dark += swapDaysTV();
        repairCost += p.kit.tv; swaps++; sc.tvFailed = true;
        log(s, 'TV failed at ' + shop.name + (hadSpare ? ' — spare from hub, dark ' + p.events.spareSwapDays + ' days.' : ' — no spare, dark ' + p.events.noSpareSwapDays + ' days.'), 'bad');
      }
      // Hotspot failure: ads keep playing from storage; costs a replacement unless on shop Wi-Fi
      var hf = p.events.hotspotFailMonthly * (sc.connectivity === 'shopWifi' ? 3 : 1);
      if (rngNext(s) < hf) {
        if (sc.connectivity !== 'shopWifi') {
          if (s.hubShopId && s.spares.hotspot > 0) { s.spares.hotspot--; sparesUsed.hotspot++; }
          repairCost += p.kit.hotspot;
        }
        log(s, (sc.connectivity === 'shopWifi' ? 'Shop Wi-Fi down' : 'Hotspot failed') + ' at ' + shop.name + ' — no monitoring for a few days, ads keep playing.', 'warn');
      }
      // Host unplugs
      var relMult = shop ? (1 - shop.hostReliability) / 0.085 : 1;
      var up = p.events.unplugMonthly * relMult * (p.opex.hostPayFollowsUptime ? 0.5 : 1);
      var u = rngNext(s), ud = rngInt(s, 1, 3);
      if (u < up) dark += ud;
      // Power cuts: only cause dark days if the player fails to restart
      var cuts = poisson(s, p.events.powerCutDaysMonthly * zone.power);
      var rf = sc.player === 'pi' ? 0 : p.events.restartFailProb;
      var restartFails = 0;
      for (var c = 0; c < cuts; c++) if (rngNext(s) < rf && !(shop && shop.hasInverter)) restartFails++;
      if (restartFails) { dark += restartFails * p.events.restartDarkDays; if (p.events.restartDarkDays > 1) swaps += restartFails; }
      // Host quits
      if (rngNext(s) < p.events.hostQuitMonthly) { dark += 1; swaps++; quitters.push(sc); }
      sc.darkDaysThisMonth = Math.min(30, dark);
      sc.uptimeShare = 1 - sc.darkDaysThisMonth / 30;
      sc.status = sc.tvFailed && dark >= p.events.noSpareSwapDays ? 'failed' : (dark > 0 ? 'dark' : 'live');
    });
    quitters.forEach(function (sc) { moveScreen(s, p, sc); });

    // shared hotspot pairing
    var shared = act.filter(function (sc) { return sc.connectivity === 'sharedHotspot'; });
    shared.forEach(function (sc) { sc.paired = false; });
    for (var i = 0; i < shared.length; i++) {
      if (shared[i].paired) continue;
      for (var j = i + 1; j < shared.length; j++) {
        if (!shared[j].paired && Math.max(Math.abs(shared[i].x - shared[j].x), Math.abs(shared[i].y - shared[j].y)) <= p.infra.sharedRange) {
          shared[i].paired = shared[j].paired = true; break;
        }
      }
    }

    // 3. demand on open slots
    var shock = p.demand.shockFromMonth > 0 && M >= p.demand.shockFromMonth && (!(p.demand.shockMonths > 0) || M < p.demand.shockFromMonth + p.demand.shockMonths);
    var churnP = (p.demand.reports ? p.demand.churnMonthly : p.demand.churnNoReports) * (shock ? p.demand.shockChurnMult : 1);
    var newAdvertisers = 0;
    if (!classic) {
      s.advertisers = s.advertisers.filter(function (a) {
        if (a.kind === 'anchor') return true;
        if (a.kind === 'founding' && M <= a.lockedUntil) return true;
        if (rngNext(s) < churnP) { log(s, NETWORK_NAMES[a.network] + ': a ' + a.kind + ' advertiser (' + a.category + ') left.', 'warn'); return false; }
        return true;
      });
      NETWORKS.forEach(function (net) {
        var nScreens = activeScreens(s, net).length;
        var draw = rngNext(s); // consumed even when not used, keeps streams aligned
        if (!nScreens) return;
        var lambda = p.demand.arrivalsPerNetwork * Math.pow(500 / listPrice(p, net), p.demand.elasticity) * (1 + p.demand.networkSizeBoost * nScreens / 10) * (shock ? p.demand.shockArrivalsMult : 1);
        var arrivals = p.demand.fixedArrivals >= 0 ? p.demand.fixedArrivals : poisson(s, lambda);
        var cap = openCapacity(s, p);
        for (var k = 0; k < arrivals; k++) {
          var free = cap - soldSlots(s, net, false);
          var half = draw < p.demand.halfShare;
          var need = half ? 0.5 : 1;
          if (free < need) break;
          var kind = s.foundersSigned < p.price.foundingCount ? 'founding' : (half ? 'half' : 'list');
          var adv = signAdvertiser(s, p, net, kind, M, nScreens);
          s.cash += adv.prepaidCash;
          newAdvertisers++;
        }
      });
      if (newAdvertisers) log(s, newAdvertisers + ' new advertiser' + (newAdvertisers > 1 ? 's' : '') + ' signed.', 'good');
    }

    // 4. anchors: renewals, auto-pitch (auto mode)
    if (!classic) {
      s.advertisers = s.advertisers.filter(function (a) {
        if (a.kind !== 'anchor' || a.endMonth >= M) return true;
        if (rngNext(s) < p.anchors.renewProb) {
          a.endMonth += a.termMonths; a.nextBillMonth = M;
          log(s, 'Anchor renewed: ' + a.name + ' on ' + NETWORK_NAMES[a.network] + '.', 'good');
          return true;
        }
        log(s, 'Anchor lease ended: ' + a.name + ' on ' + NETWORK_NAMES[a.network] + '.', 'warn');
        return false;
      });
      if (p.anchors.enabled && p.growth.autoExpand) {
        NETWORKS.forEach(function (net) {
          if (!activeScreens(s, net).length) return;
          for (var k = 0; k < p.anchors.autoPitchPerMonth; k++) {
            if (anchorSlotsUsed(s, net) + 1 > p.anchors.slotsPerNetwork) return;
            var pool = s.institutions.filter(function (inst) { return inst.cooldownUntil <= M && !hasAnchor(s, inst.id, net); });
            if (!pool.length) return;
            var inst = pool[Math.floor(rngNext(s) * pool.length)];
            pitchAnchorCore(s, p, inst, { network: net, slots: 1, termMonths: p.anchors.termMonths, billing: p.anchors.billing, exclusive: false, seasonal: p.anchors.seasonalWeighting }, M);
          }
        });
      }
    }

    // 5. revenue
    var rev = { ph: 0, ki: 0 }, nonAnchorRev = 0, anchorRev = 0, anchorBilled = 0, anchorTds = 0;
    var clientRev = {};
    var uptimeSum = 0, actNow = activeScreens(s);
    actNow.forEach(function (sc) { uptimeSum += sc.uptimeShare; });
    if (classic) {
      actNow.forEach(function (sc) { rev[sc.network] += p.classic.revenuePerScreen * sc.uptimeShare; });
      nonAnchorRev = rev.ph + rev.ki;
    } else {
      NETWORKS.forEach(function (net) {
        var scs = activeScreens(s, net);
        if (!scs.length) return;
        var U = 0; scs.forEach(function (sc) { U += sc.uptimeShare; });
        var eff = p.demand.makeGood ? U : scs.length;
        s.advertisers.forEach(function (a) {
          if (a.network !== net) return;
          if (a.kind === 'anchor') {
            if (a.startMonth > M) return;
            var r = advMonthlyRate(p, a, M) * eff;
            anchorRev += r; rev[net] += r;
            clientRev[a.id] = (clientRev[a.id] || 0) + r;
            if (a.nextBillMonth === M) {
              var period = a.billing === 'annual' ? 12 : 3;
              var billed = advMonthlyRate(p, a, M) * scs.length * period;
              anchorBilled += billed; anchorTds += billed * p.anchors.tdsRate;
              a.nextBillMonth = M + period;
            }
            return;
          }
          if (a.kind === 'founding' && M <= a.prepaidUntil) return;
          if (rngNext(s) < p.events.adRuleBreach) {
            breaches++;
            log(s, 'Ad pulled for a rule breach (' + a.category + ') — refunded this month.', 'warn');
            return;
          }
          var rr = advMonthlyRate(p, a, M) * eff;
          nonAnchorRev += rr; rev[net] += rr;
        });
      });
    }
    var revenue = nonAnchorRev + anchorRev;

    // 6. costs
    var hostFees = 0, reserve = 0, licences = 0, data = 0;
    var selfHosted = p.infra.cms === 'selfHosted' && M >= p.infra.cmsSwitchMonth;
    var licIndex = 0;
    actNow.forEach(function (sc) {
      if (classic) return;
      hostFees += p.opex.hostFee * (p.opex.hostPayFollowsUptime ? sc.uptimeShare : 1) + (sc.connectivity === 'shopWifi' ? p.infra.shopWifiHostFeeExtra : 0);
      reserve += p.opex.reserve;
      var age = M - sc.installedMonth - 1;
      var lic = age < 12 ? p.opex.licenceY1 : p.opex.licenceY2;
      if (selfHosted && !p.infra.selfHostedNeedsLicence) lic = 0;
      if (p.mode !== 'plan' && licIndex < p.opex.freeLicences) lic = 0;
      licIndex++;
      licences += lic;
      data += sc.connectivity === 'shopWifi' ? 0 : (sc.connectivity === 'sharedHotspot' && sc.paired ? p.opex.data / 2 : p.opex.data);
    });
    if (selfHosted && !classic) licences += p.infra.vpsMonthly;
    var nLive = actNow.length;
    var fixed = classic ? nLive * p.classic.expensePerScreen : fixedCost(p, nLive);
    var gateway = classic ? 0 : nonAnchorRev * p.feeRate + anchorRev * p.anchors.feeRate;
    var interest = Math.max(0, -cashBefore) * p.start.creditInterestMonthly;

    // 9 (folded in). repairs come out of the reserve fund first, then cash
    s.reserveFund += reserve;
    var fromFund = Math.min(s.reserveFund, repairCost);
    s.reserveFund -= fromFund;
    var overflow = repairCost - fromFund;
    reserve += overflow;
    // spares used this month are restocked; the replacement is already inside repairCost
    s.spares.tv += sparesUsed.tv; s.spares.hotspot += sparesUsed.hotspot;

    var costs = gateway + hostFees + reserve + licences + data + fixed + interest;
    var profit = revenue - costs;

    // 7. cash (anchors billed in advance, recognised monthly; TDS back once a year)
    var tdsBack = 0;
    s.tdsReceivable += anchorTds;
    if (M >= 15 && (M - 15) % 12 === 0 && s.tdsReceivable > 0) { tdsBack = s.tdsReceivable; s.tdsReceivable = 0; log(s, 'TDS refund received: ' + fmtINR(tdsBack) + '.', 'good'); }
    s.cash += topup + profit + (anchorBilled - anchorTds - anchorRev) + tdsBack;

    // 8. credit line / insolvency
    if (s.cash < -s.creditLimit) {
      var lines = { 'host fees': hostFees, 'fixed costs': fixed, 'licences': licences, 'data': data, 'hardware reserve and repairs': reserve, 'interest': interest };
      var big = Object.keys(lines).sort(function (a, b) { return lines[b] - lines[a]; })[0];
      s.insolvent = { month: M, cause: 'Cash need of ' + fmtINR(-s.cash) + ' went past the credit limit of ' + fmtINR(s.creditLimit) +
        '. This month: revenue ' + fmtINR(revenue) + ', costs ' + fmtINR(costs) + ' (largest: ' + big + ' ' + fmtINR(lines[big]) + ').' };
      log(s, 'INSOLVENT in month ' + M + ': ' + s.insolvent.cause, 'bad');
    }

    // 10. growth
    var gates = gateStatus(s, p);
    if (!s.insolvent && p.growth.autoExpand) minutes += autoExpand(s, p) * p.founder.pitch;

    // 11. founder minutes
    var nAnchors = s.advertisers.filter(function (a) { return a.kind === 'anchor'; }).length;
    if (!classic) {
      minutes += s.approvalsThisMonth * p.founder.approveAd + breaches * (p.founder.breach + p.founder.approveAd);
      minutes += p.founder.appsScript ? 30 + 0.5 * nLive : p.founder.closeBase + p.founder.closePerScreen * nLive;
      minutes += p.founder.weeklyReview * 4.3;
      minutes += nAnchors * p.founder.anchorAccount;
      if (selfHosted) minutes += p.founder.selfHostedExtra;
    }
    minutes += swaps * p.founder.swap + s.pitchesThisMonth * p.founder.pitch;
    s.approvalsThisMonth = 0; s.pitchesThisMonth = 0;

    var row = {
      month: M,
      screens_ph: s.screens.filter(function (x) { return x.network === 'ph'; }).length,
      screens_ki: s.screens.filter(function (x) { return x.network === 'ki'; }).length,
      slots_sold_ph: soldSlots(s, 'ph', true), slots_sold_ki: soldSlots(s, 'ki', true),
      revenue: round(revenue), gateway_fees: round(gateway), host_fees: round(hostFees), reserve: round(reserve),
      licences: round(licences), data: round(data), fixed: round(fixed), interest: round(interest),
      profit: round(profit), cash: round(s.cash), credit_used: round(Math.max(0, -s.cash)),
      uptime_pct: nLive ? Math.round(uptimeSum / nLive * 1000) / 10 : 100,
      founder_hours_week: round2(minutes / 60 / 4.3),
      anchors_active: nAnchors,
      monthly_advertisers: s.advertisers.filter(function (a) { return a.kind !== 'anchor'; }).length
    };
    s.ledger.push(row);

    // gate notices + concentration
    var notices = gates.slice();
    if (revenue > 0) for (var id in clientRev) if (clientRev[id] / revenue > 0.2) {
      var an = s.advertisers.filter(function (a) { return a.id === id; })[0];
      notices.push({ kind: 'warn', text: 'Concentration: ' + (an ? an.name : 'one client') + ' is ' + Math.round(clientRev[id] / revenue * 100) + '% of revenue' });
    }
    if (profit >= 100000 && !s.ledger.slice(0, -1).some(function (r) { return r.profit >= 100000; })) log(s, 'First month with net ≥ ₹1 lakh!', 'good');
    s.notices = notices;
    return row;
  }

  function gateStatus(s, p) {
    var out = [];
    NETWORKS.forEach(function (net) {
      var n = s.screens.filter(function (x) { return x.network === net; }).length;
      var sold = soldSlots(s, net, true);
      if (n > 0 && n < p.growth.maxPerNetwork && sold >= p.growth.expandWhenSold)
        out.push({ kind: 'gate', text: NETWORK_NAMES[net] + ' gate met: ' + sold + ' of ' + p.loop.sellable + ' sold' });
    });
    var ph = s.screens.filter(function (x) { return x.network === 'ph'; }).length;
    var ki = s.screens.filter(function (x) { return x.network === 'ki'; }).length;
    if (!ki && ph >= p.growth.kiranaLaunchWhenPharmacyScreens && soldSlots(s, 'ph', true) >= p.growth.expandWhenSold)
      out.push({ kind: 'gate', text: 'Kirana launch gate met' });
    return out;
  }

  // Section 9.1 expansion rule; returns number of new hosts.
  function autoExpand(s, p) {
    var added = 0;
    var kc = kitCost(p, p.infra.player);
    NETWORKS.forEach(function (net) {
      var type = net === 'ph' ? 'pharmacy' : 'kirana';
      var n = s.screens.filter(function (x) { return x.network === net; }).length;
      var sold = soldSlots(s, net, true);
      var add = 0;
      if (net === 'ki' && n === 0) {
        var phN = s.screens.filter(function (x) { return x.network === 'ph'; }).length;
        if (soldSlots(s, 'ph', true) >= p.growth.expandWhenSold && phN >= p.growth.kiranaLaunchWhenPharmacyScreens && s.cash >= p.growth.batch * kc) add = p.growth.batch;
      } else if (n > 0 && sold >= p.growth.expandWhenSold && n < p.growth.maxPerNetwork) {
        add = Math.min(p.growth.batch, p.growth.maxPerNetwork - n);
        if (s.cash < add * kc) add = 0;
      }
      if (!add) return;
      var hosts = pickHosts(s, p, type, add);
      hosts.forEach(function (shop) { shop.state = 'host'; addScreen(s, p, shop, s.month); s.cash -= kc; added++; });
      if (hosts.length) log(s, (n === 0 ? 'Launched ' : 'Expanded ') + NETWORK_NAMES[net] + ': +' + hosts.length + ' screens (' + fmtINR(hosts.length * kc) + ').', 'good');
    });
    return added;
  }

  function moveScreen(s, p, sc) {
    var old = shopById(s, sc.shopId);
    var cands = s.shops.filter(function (sh) { return sh.type === old.type && sh.zone === old.zone && sh.state === 'prospect' && !screenAt(s, sh.id); });
    if (!cands.length) cands = s.shops.filter(function (sh) { return sh.type === old.type && sh.state === 'prospect' && !screenAt(s, sh.id); });
    old.state = 'removed';
    if (s.hubShopId === old.id) s.hubShopId = null;
    if (!cands.length) {
      s.screens = s.screens.filter(function (x) { return x !== sc; });
      s.cash += kitCost(p, sc.player) * 0.5;
      log(s, old.name + ' ended the agreement; no new host available, screen sold.', 'bad');
      return;
    }
    var nu = cands[0];
    nu.state = 'host';
    sc.shopId = nu.id; sc.x = nu.x; sc.y = nu.y; sc.zone = nu.zone;
    log(s, old.name + ' ended the agreement; screen moved to ' + nu.name + ' (1 trip day).', 'warn');
  }

  function hasAnchor(s, instId, net) {
    return s.advertisers.some(function (a) { return a.kind === 'anchor' && a.instId === instId && a.network === net; });
  }

  // ---------- player actions ----------
  function fundsAvailable(s) { return s.cash + s.creditLimit; }

  function pitchHost(s, shopId, opts) {
    var p = effective(s.params);
    var shop = shopById(s, shopId);
    if (!shop) return { ok: false, reason: 'No such shop.' };
    if (shop.state !== 'prospect') return { ok: false, reason: shop.state === 'pitched' ? 'Cooling off until month ' + shop.cooldownUntil + '.' : 'Already a host.' };
    var offer = !!(opts && opts.offerHostSlot);
    var chance = p.hostPitch.success + (offer ? p.hostPitch.hostSlotBonus : 0);
    s.pitchesThisMonth++;
    if (rngNext(s) < chance) {
      shop.state = 'host'; shop.hostSlot = offer;
      log(s, shop.name + ' agreed to host a screen' + (offer ? ' (host slot offered)' : '') + '.', 'good');
      return { ok: true };
    }
    shop.state = 'pitched'; shop.cooldownUntil = s.month + p.hostPitch.cooldownMonths;
    log(s, shop.name + ' said no. Try again in ' + p.hostPitch.cooldownMonths + ' months.', 'warn');
    return { ok: false, reason: 'They said no. Cooling off for ' + p.hostPitch.cooldownMonths + ' months.' };
  }

  function installScreen(s, shopId, infra) {
    var p = effective(s.params);
    var shop = shopById(s, shopId);
    if (!shop || shop.kind !== 'shop') return { ok: false, reason: 'Not a shop.' };
    if (shop.state !== 'host') return { ok: false, reason: 'Pitch the shop first.' };
    if (screenAt(s, shopId)) return { ok: false, reason: 'Already has a screen.' };
    var player = (infra && infra.player) || p.infra.player;
    var cost = kitCost(p, player);
    if (fundsAvailable(s) < cost) return { ok: false, reason: 'Not enough money or credit (' + fmtINR(cost) + ' needed).' };
    s.cash -= cost;

<script id="ui">
(function () {
  'use strict';

  var AUTOSAVE_KEY = 'haspot-sim-autosave-v1';
  var PERIOD = { 1: 60000, 2: 5000, 3: 1000 }; // ms per month by speed

  var S = null;            // game state
  var speed = 0, acc = 0, lastTs = 0;
  var selected = null;     // { kind: 'shop'|'inst', id }
  var netTab = 'ph';
  var view = { scale: 1, ox: 0, oy: 0 };

  var selMsg = null;       // { text, cls } shown under the selection panel

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function lastRow() { return S.ledger[S.ledger.length - 1] || null; }
  function compact(v) {
    var a = Math.abs(v), sg = v < 0 ? '−' : '';

    if (a >= 1e5) return sg + '₹' + (a / 1e5).toFixed(a >= 1e6 ? 0 : 1) + 'L';

  function pct(x) { return x == null || isNaN(x) ? '—' : Math.round(x * 100) + '%'; }

  // ---------- autosave (per-browser convenience only) ----------

  // ---------- game lifecycle ----------
  function startGame(state) {

    document.querySelectorAll('#speedbox [data-speed]').forEach(function (b) { b.classList.toggle('on', +b.dataset.speed === 0); });
    fitView(); renderAll(); autosave();
  }
  function doTick() {
    if (!S || S.insolvent) return;
    E.tick(S);
    checkMilestones(false);

    if (S.insolvent) { reportFrom = null; setSpeed(0); renderAll(); gameOverModal(); }
    autosave();
  }
  function setSpeed(v) {

    ctx.setLineDash([]);

      ctx.fillText({ hospital: 'H', school: 'S', coaching: 'C', lab: 'L' }[b.type], x + T, y + T);

    });

      }
      if (S.hubShopId === b.id) { ctx.fillStyle = '#E9A23B'; ctx.beginPath(); ctx.arc(x + T - 4, y + 4, 4, 0, 7); ctx.fill(); ctx.strokeStyle = '#14231F'; ctx.lineWidth = 1; ctx.stroke(); }
      if (selected && selected.id === b.id) { ctx.strokeStyle = '#E9A23B'; ctx.lineWidth = 3; roundRect(x + 0.5, y + 0.5, T - 1, T - 1, 4); ctx.stroke(); }
      if (hover && hover.id === b.id && !(selected && selected.id === b.id)) { ctx.strokeStyle = '#14231F'; ctx.lineWidth = 1.5; roundRect(x + 1, y + 1, T - 2, T - 2, 4); ctx.stroke(); }
    });

    ctx.font = '600 13px system-ui, sans-serif'; ctx.textBaseline = 'top';

  function roundRect(x, y, w, h, r) {

  function hitTest(cx, cy) {
    var wx = (cx - view.ox) / view.scale / T, wy = (cy - view.oy) / view.scale / T;

    for (var j = 0; j < S.institutions.length; j++) { var c = S.institutions[j]; if (tx >= c.x && tx < c.x + 2 && ty >= c.y && ty < c.y + 2) return { kind: 'inst', id: c.id }; }
    return null;
  }

      if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; canvas.classList.add('dragging'); }
      if (drag.moved) { view.ox = drag.ox + dx; view.oy = drag.oy + dy; dirty = true; }
      return;
    }
    if (!S || e.target !== canvas) { if (hover) { hover = null; $('tip').style.display = 'none'; dirty = true; } return; }
    var r = canvas.getBoundingClientRect();
    var h = hitTest(e.clientX - r.left, e.clientY - r.top);
    if ((h && h.id) !== (hover && hover.id)) { hover = h; dirty = true; }
    showTip(h, e.clientX - r.left, e.clientY - r.top);
  });
  window.addEventListener('mouseup', function (e) {
    if (!drag) return;
    var wasDrag = drag.moved; drag = null; canvas.classList.remove('dragging');

  function renderNet() {

  // ---------- charts (inline SVG) ----------
  function chart(opts) {
    var w = opts.w || 680, h = opts.h || 230, L = 64, R = 12, Tm = 12, B = 26;
    var all = [0];
    opts.series.forEach(function (s) { s.values.forEach(function (v) { if (v != null && isFinite(v)) all.push(v); }); });
    (opts.bands || []).forEach(function (b) { b.lo.concat(b.hi).forEach(function (v) { if (v != null && isFinite(v)) all.push(v); }); });
    var n = Math.max.apply(null, opts.series.map(function (s) { return s.values.length; }).concat([2]));
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi === lo) hi = lo + 1;
    var step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    var X = function (i) { return L + (i / Math.max(1, n - 1)) * (w - L - R); };
    var Y = function (v) { return Tm + (1 - (v - lo) / (hi - lo)) * (h - Tm - B); };
    var out = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opts.title || 'chart') + '">';
    for (var v = lo; v <= hi + 1e-9; v += step) {
      out += '<line x1="' + L + '" x2="' + (w - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + (Math.abs(v) < 1e-9 ? '#14231F' : '#E1D6C1') + '" stroke-width="' + (Math.abs(v) < 1e-9 ? 1.2 : 1) + '"/>';
      out += '<text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + compact(v) + '</text>';
    }
    for (var i = 0; i < n; i++) if ((i + 1) % 6 === 0 || i === 0) out += '<text x="' + X(i) + '" y="' + (h - 8) + '" text-anchor="middle">m' + (i + 1) + '</text>';
    if (opts.refLine != null && opts.refLine >= lo && opts.refLine <= hi) out += '<line x1="' + L + '" x2="' + (w - R) + '" y1="' + Y(opts.refLine) + '" y2="' + Y(opts.refLine) + '" stroke="#2F7D4F" stroke-dasharray="4 4"/><text x="' + (w - R) + '" y="' + (Y(opts.refLine) - 4) + '" text-anchor="end" style="fill:#2F7D4F">₹1 lakh net</text>';
    (opts.bands || []).forEach(function (b) {
      var pts = [];
      b.hi.forEach(function (v, i) { if (v != null && isFinite(v)) pts.push(X(i) + ',' + Y(v)); });
      for (var k = b.lo.length - 1; k >= 0; k--) if (b.lo[k] != null && isFinite(b.lo[k])) pts.push(X(k) + ',' + Y(b.lo[k]));
      out += '<polygon points="' + pts.join(' ') + '" fill="' + b.color + '" opacity="0.28"/>';
    });
    opts.series.forEach(function (s) {
      var d = '';
      s.values.forEach(function (v, i) { if (v == null || !isFinite(v)) return; d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
      out += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.2"' + (s.dash ? ' stroke-dasharray="6 4"' : '') + '/>';
    });
    return out + '</svg>';
  }
  function niceStep(raw) { var p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9)))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

  var MILESTONES = [

    { id: 'anchor', icon: '🏥', title: 'Anchor signed', hint: 'An institution leases slots', test: function (s) { return s.advertisers.some(function (a) { return a.kind === 'anchor'; }); } },
    { id: 'half', icon: '🥈', title: '₹50k a month', hint: 'Net profit', target: 50000, value: function (s) { return Math.max(0, bestProfit(s)); }, money: true },
    { id: 'lakh', icon: '🏆', title: '₹1 lakh a month', hint: 'Net profit', target: 100000, value: function (s) { return Math.max(0, bestProfit(s)); }, money: true },
    { id: 'full', icon: '🏙️', title: '42 screens', hint: 'Screens', target: 42, value: screensN },

    { id: 'steady', icon: '⚙️', title: 'Smooth running', hint: '6 months at ≥ 98% uptime', test: function (s) { var L = s.ledger.slice(-6); return L.length === 6 && L.every(function (r) { return r.uptime_pct >= 98 && r.screens_ph + r.screens_ki > 0; }); } }
  ];
  function msDone(m, s) { return m.test ? m.test(s) : m.value(s) >= m.target; }
  function checkMilestones(silent) {
    if (!S) return [];
    if (!S.achievements) S.achievements = {};
    var fresh = [];
    MILESTONES.forEach(function (m) {
      if (S.achievements[m.id] != null) return;
      if (msDone(m, S)) {
        S.achievements[m.id] = S.month; fresh.push(m);
        if (!silent) { S.log.unshift({ month: S.month, text: 'Milestone: ' + m.title + '!', kind: 'good' }); toast(m); }

  var toastPending = [], toastTimer = null;

    toastTimer = null;

  // =====================================================================
  // Tips: one rule list shared by the dashboard and the report card
  // =====================================================================
  function tips(s) {
    var p = E.effective(s.params), r = s.ledger[s.ledger.length - 1], out = [];
    var limit = s.creditLimit >= 1e14 ? Infinity : s.creditLimit;
    var used = Math.max(0, -s.cash);
    if (!s.screens.length) {
      if (!s.shops.some(function (x) { return x.state === 'host'; })) out.push({ text: 'Pitch a pharmacy on the City map. Offering the host slot raises your odds to 50%.', btn: 'Open City map', act: 'map' });
      else out.push({ text: 'A shop said yes. Install your first screen there, and it starts earning next month.', btn: 'Open City map', act: 'map' });
      return out;
    }
    if (isFinite(limit) && used > 0.7 * limit) out.push({ text: 'Credit is ' + Math.round(used / limit * 100) + '% used. Hold off on new screens until cash recovers.', btn: 'See ledger', act: 'ledger', tone: 'bad' });
    E.gateStatus(s).forEach(function (g) { out.push({ text: g.text + '. Time to add screens: each new one earns from the slots you have already sold.', btn: p.growth.autoExpand ? null : 'Open City map', act: 'map' }); });
    if (r && r.uptime_pct < 97) out.push({ text: 'Uptime was ' + r.uptime_pct + '% last month, and dark screens cost refunds. ' + (s.hubShopId ? 'Keep a spare TV at the hub.' : 'Mark a hub shop and buy a spare TV.'), btn: 'Open City map', act: 'map' });
    else if (!s.hubShopId) out.push({ text: 'No hub shop yet. Mark one host as the hub so a spare TV turns a 10-day outage into 2 days.', btn: 'Open City map', act: 'map' });
    if (r && r.founder_hours_week > 4) out.push({ text: 'You are spending ' + r.founder_hours_week.toFixed(1) + ' hours a week. Turning on Apps Script halves the monthly close.', btn: 'Open Config', act: 'config' });
    (s.notices || []).filter(function (n) { return n.kind === 'warn'; }).forEach(function (n) { out.push({ text: n.text + '. Spread the risk across more clients.', act: null }); });
    var full = ['ph', 'ki'].filter(function (n) { return s.screens.some(function (x) { return x.network === n; }) && E.soldSlots(s, n, true) >= p.loop.sellable; });
    if (full.length) out.push({ text: E.NETWORK_NAMES[full[0]] + ' is sold out. Try raising its list price; the Scenario lab suggests ₹600 earns more once networks are full.', btn: 'Open City map', act: 'map' });
    if (r && r.profit >= 100000) out.push({ text: 'You have hit ₹1 lakh a month. Check the Scenario lab to see how your plan holds up in a recession.', btn: 'Open Scenario lab', act: 'analysis' });
    if (!out.length) out.push({ text: 'Things are steady. Let a few months run and watch the slots fill.', btn: null });
    return out;
  }

  // =====================================================================
  // Small SVG helpers
  // =====================================================================
  function spark(vals, color) {
    vals = vals.filter(function (v) { return v != null && isFinite(v); });
    if (vals.length < 2) return '<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="100" y1="26" y2="26" stroke="#E1D6C1" stroke-width="1"/></svg>';
    var lo = Math.min.apply(null, vals.concat([0])), hi = Math.max.apply(null, vals); if (hi === lo) hi = lo + 1;
    var pts = vals.map(function (v, i) { return (i / (vals.length - 1) * 98 + 1).toFixed(1) + ',' + (27 - (v - lo) / (hi - lo) * 24).toFixed(1); });
    var zero = 27 - (0 - lo) / (hi - lo) * 24;
    var last = pts[pts.length - 1].split(',');
    return '<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">' +
      (lo < 0 ? '<line x1="0" x2="100" y1="' + zero + '" y2="' + zero + '" stroke="#CDBFA6" stroke-width="1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>' : '') +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + (color || '#2B3D38') + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.4" fill="' + (color || '#2B3D38') + '"/></svg>';
  }
  function ring(frac, label, sub, color) {
    var r = 60, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
    return '<svg viewBox="0 0 150 150" role="img" aria-label="' + esc(label + ' ' + sub) + '"><circle cx="75" cy="75" r="' + r + '" fill="none" stroke="#ECE4D4" stroke-width="14"/>' +
