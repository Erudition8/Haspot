    var tp = tips(S).slice(0, 2);
    var html = '<h2>Report card <span class="stars" aria-label="' + stars + ' of 3 stars">' + '★★★'.slice(0, stars) + '<span style="color:#CDBFA6">' + '★★★'.slice(stars) + '</span></span></h2><p class="lede">' + span + '</p>' +
      '<div class="kpis3"><div><b class="' + (last.profit < 0 ? 'neg' : '') + '">' + fmt(last.profit) + '</b><span>net profit' + (a === b ? '' : ' (last month)') + '</span></div><div><b>' + fmt(last.revenue) + '</b><span>revenue</span></div><div><b>' + last.uptime_pct + '%</b><span>uptime</span></div></div>' +
      '<div class="rc-grid"><div><h3>Where the cash went</h3>' +
      waterfall([['Opening cash', open, 'total'], ['Salary top-up', topup], ['Revenue', rev], ['Running costs', -costs], ['Screens & other', other], ['Closing cash', last.cash, 'total']].filter(function (x) { return x[2] === 'total' || Math.abs(x[1]) >= 1; })) +
      '<h3>Changes</h3><div class="facts">' +
      '<div class="row2"><span>Advertisers</span><span>' + (dAdv >= 0 ? '+' : '') + dAdv + ' (now ' + last.monthly_advertisers + ')</span></div>' +
      '<div class="row2"><span>Anchor leases</span><span>' + (dAnc >= 0 ? '+' : '') + dAnc + ' (now ' + last.anchors_active + ')</span></div>' +
      '<div class="row2"><span>Screens</span><span>' + (dScr >= 0 ? '+' : '') + dScr + ' (now ' + (last.screens_ph + last.screens_ki) + ')</span></div>' +
      '<div class="row2"><span>Your time</span><span>' + last.founder_hours_week.toFixed(1) + ' h / week</span></div></div></div>' +
      '<div><h3>What happened</h3><ul class="feed">' + (events.map(function (l) { return '<li class="' + l.kind + '"><span class="ic">' + ({ good: '✓', warn: '!', bad: '✕' }[l.kind] || 'i') + '</span><span class="m">m' + l.month + '</span><span>' + esc(l.text) + '</span></li>'; }).join('') || '<li class="empty">A quiet month.</li>') + '</ul>' +
      (ms.length ? '<h3>Milestones</h3><div class="badges">' + ms.map(function (m) { return '<div class="badge on"><div class="ic">' + m.icon + '</div><div class="bt">' + esc(m.title) + '</div></div>'; }).join('') + '</div>' : '') +
      '<h3>Tip for next month</h3>' + tp.map(function (t) { return '<div class="msg" style="background:#FFF6E3">' + esc(t.text) + '</div>'; }).join('') + '</div></div>' +
      '<div class="foot"><label class="loopkey" style="margin-right:auto"><input type="checkbox" id="rcOff"> Don\'t show after each month</label><button data-m="ledger">View ledger</button><button data-m="dash">Open dashboard</button><button class="primary" data-m="close">Continue</button></div>';
    openModal(html, true);
    $('rcOff').addEventListener('change', function () { try { localStorage.setItem(REPORT_KEY, this.checked ? 'off' : 'on'); } catch (e) { /* ignore */ } $('reportToggle').checked = !this.checked; });
    bindModal({ close: closeModal, ledger: function () { ledgerModal(); }, dash: function () { closeModal(); setTab('dash'); } });
  }

  // =====================================================================
  // Scenario lab
  // =====================================================================
  var lab = null, labRunning = false;
  try { var cached = localStorage.getItem('haspot-sim-lab'); if (cached) lab = JSON.parse(cached); if (lab && (!lab.cells[0].soldMedianByMonth || lab.cells.length !== E.STRATEGIES.length * E.ECONOMIES.length)) lab = null; } catch (e) { lab = null; }
  function sName(id) { var s = E.STRATEGIES.filter(function (x) { return x.id === id; })[0]; return s ? s.name : id; }
  function eName(id) { var s = E.ECONOMIES.filter(function (x) { return x.id === id; })[0]; return s ? s.name : id; }
  function heatColor(v) { // sequential single hue (blue), light → dark
    var a = [234, 242, 252], b = [22, 70, 140], t = Math.max(0, Math.min(1, v));
    return 'rgb(' + a.map(function (x, i) { return Math.round(x + (b[i] - x) * t); }).join(',') + ')';
  }
  function renderLab() {
    var el = $('view-analysis');
    var h = '<div class="dash"><div class="card hero c12"><div class="grow"><div class="big">Scenario lab</div><div class="small">Runs every strategy in every economy (' + E.STRATEGIES.length + ' × ' + E.ECONOMIES.length + ' = ' + E.STRATEGIES.length * E.ECONOMIES.length +
      ' scenarios) with hundreds of random runs each, writes a report for each economy, and picks the plan that holds up best.</div></div>' +
      '<label style="color:#B9C3BD">Runs per scenario <select id="labRuns" style="color:var(--ink)"><option>100</option><option selected>200</option><option>300</option><option>500</option></select></label>' +
      '<label style="color:#B9C3BD">Months <select id="labMonths" style="color:var(--ink)"><option>24</option><option selected>36</option></select></label>' +
      '<button class="accent" data-l="run"' + (labRunning ? ' disabled' : '') + '>' + (lab ? 'Run again' : 'Run all scenarios') + '</button>' +
      '<button data-l="mc">Single Monte Carlo…</button><button data-l="compare">Compare two…</button></div>' +
      '<div class="c12" id="labProg" style="display:none"><div class="lab-progress"><i></i></div><div class="loopkey" id="labProgTxt"></div></div>';
    if (!lab) {
      h += '<div class="card c6"><h2>Economies</h2>' + E.ECONOMIES.map(function (e) { return '<div class="netrow"><div class="name">' + esc(e.name) + '</div><div class="sub" style="margin:2px 0 0">' + esc(e.desc) + '</div></div>'; }).join('') + '</div>' +
        '<div class="card c6"><h2>Strategies</h2>' + E.STRATEGIES.map(function (e) { return '<div class="netrow"><div class="name">' + esc(e.name) + '</div><div class="sub" style="margin:2px 0 0">' + esc(e.desc) + '</div></div>'; }).join('') + '</div>';
    } else {
      var sum = lab.summary, bo = sum.overall[0], ins = E.labInsights(lab.cells, sum), tl = lab.timeline;
      // recommended plan
      h += '<div class="card c7 plan"><h2>Recommended plan <span class="pill go">best of ' + E.STRATEGIES.length + '</span></h2>' +
        '<div style="font-size:24px;font-weight:800;margin:4px 0">' + esc(sName(sum.best)) + '</div><div class="sub">' + esc(E.STRATEGIES.filter(function (x) { return x.id === sum.best; })[0].desc) + '</div>' +
        '<div class="kpis3"><div><b>' + pct(bo.avgP24) + '</b><span>avg chance of ₹1L by m24</span></div><div><b>' + pct(bo.worstP24) + '</b><span>worst case (' + esc(eName(bo.worstEconomy)) + ')</span></div><div><b>' + bo.wins.length + ' of ' + E.ECONOMIES.length + '</b><span>economies won</span></div></div>' +
        '<h3 style="margin:12px 0 2px;font-size:12px;color:var(--muted);text-transform:uppercase">Why this one</h3><ul style="margin:4px 0;padding-left:18px">' + ins.why.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
        '<h3 style="margin:12px 0 2px;font-size:12px;color:var(--muted);text-transform:uppercase">Watch-outs</h3><ul style="margin:4px 0;padding-left:18px">' + ins.watch.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
        '<h3 style="margin:12px 0 2px;font-size:12px;color:var(--muted);text-transform:uppercase">Month by month (typical run, normal economy)</h3><ol>' + tl.steps.map(function (st) { return '<li><b>Month ' + st.month + ':</b> ' + esc(st.text) + '</li>'; }).join('') + '</ol>' +
        '<div class="actions"><button class="primary" data-l="play" data-s="' + sum.best + '" data-e="normal">▶ Play this plan</button><button data-l="plan">Download plan (.md)</button><button data-l="md">Download all reports (.md)</button></div></div>';
      // ranking
      h += '<div class="card c5"><h2>Strategy ranking</h2><div class="sub">Averaged over all ' + E.ECONOMIES.length + ' economies</div>' +
        '<div class="rankrow h"><span></span><span>Strategy</span><span>Score</span><span>Avg P(₹1L m24)</span><span>Worst case</span></div>' +
        sum.overall.map(function (o, i) { return '<div class="rankrow' + (i ? '' : ' top') + '"><span class="n">' + (i + 1) + '</span><span>' + esc(sName(o.strategy)) + '</span><span>' + o.avgScore.toFixed(0) + '</span><span>' + pct(o.avgP24) + '</span><span data-tip="Worst in ' + esc(eName(o.worstEconomy)) + '">' + pct(o.worstP24) + '</span></div>'; }).join('') +
        '<div class="loopkey" style="margin-top:8px">Score = 100 × P(₹1L by m24) + 30 × P(by m18) − 150 × P(out of credit) + median net at the end ÷ ₹10k − 5 per hour a week over 4.</div></div>';
      // heatmap
      h += '<div class="card c12"><h2>Chance of ₹1 lakh a month by month 24 <span class="legendmini"><span><i class="sq" style="background:' + heatColor(0) + ';border:1px solid #CDBFA6"></i>0%</span><span><i class="sq" style="background:' + heatColor(0.5) + '"></i>50%</span><span><i class="sq" style="background:' + heatColor(1) + '"></i>100%</span><span style="outline:2px solid var(--ink);padding:0 4px;border-radius:3px">best in economy</span></span></h2><div class="sub">Hover a cell for the detail. Each cell is ' + lab.cells[0].runs + ' runs over ' + lab.cells[0].months + ' months.</div>' +
        '<table class="heat"><thead><tr><th></th>' + E.ECONOMIES.map(function (e) { return '<th>' + esc(e.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        E.STRATEGIES.map(function (st) {
          return '<tr><td class="rowh">' + esc(st.name) + '</td>' + E.ECONOMIES.map(function (ec) {
            var c = lab.cells.filter(function (x) { return x.strategy === st.id && x.economy === ec.id; })[0];
            if (!c) return '<td>—</td>';
            var isBest = sum.byEconomy[ec.id][0].strategy === st.id;
            return '<td class="' + (isBest ? 'best' : '') + '" style="background:' + heatColor(c.pLakhBy24) + ';color:' + (c.pLakhBy24 > 0.5 ? '#fff' : '#14231F') + '" data-tip="' + esc(st.name + ' · ' + ec.name) + '\nP(₹1L by m18) ' + pct(c.pLakhBy18) + ' · by m24 ' + pct(c.pLakhBy24) + '\nMedian net m24 ' + fmt(c.medianNet24) + '\nOut of credit ' + pct(c.pCreditBreached) + '\nScore ' + c.score.toFixed(0) + '">' + pct(c.pLakhBy24) + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
      // per-economy reports
      h += '<div class="c12"><h2 style="margin:6px 2px 0;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)">Scenario reports</h2></div><div class="c12 scgrid">';
      E.ECONOMIES.forEach(function (ec) {
        var list = sum.byEconomy[ec.id], top = list[0];
        var maxNet = Math.max.apply(null, list.map(function (c) { return Math.max(0, c.medianNet24 || 0); }).concat([1]));
        h += '<div class="card"><h2>' + esc(ec.name) + ' <span class="pill go">best: ' + esc(sName(top.strategy)) + '</span></h2><div class="sub">' + esc(ec.desc) + ' <button style="padding:0 6px;font-size:11.5px" data-l="ecmd" data-e="' + ec.id + '">Report ↓</button></div>' +
          '<div class="facts"><div class="row2"><span>Best chance of ₹1L by m24</span><span>' + pct(top.pLakhBy24) + '</span></div><div class="row2"><span>Median month to ₹1L</span><span>' + (top.medianMonthToLakh == null ? 'not reached' : 'month ' + Math.round(top.medianMonthToLakh)) + '</span></div>' +
          '<div class="row2"><span>5th-percentile lowest cash</span><span>' + fmt(top.p5LowestCash) + '</span></div></div>' +
          '<div class="sub" style="margin:8px 0 2px">Median net profit at month 24, by strategy</div>' +
          list.map(function (c) {
            return '<div class="hbar" style="grid-template-columns:130px 1fr 64px 26px" data-tip="' + esc(sName(c.strategy)) + '\nP(₹1L by m24) ' + pct(c.pLakhBy24) + '\nMedian net m12 ' + fmt(c.medianNet12) + ', m24 ' + fmt(c.medianNet24) + ', m' + c.months + ' ' + fmt(c.medianNet36) + '\nHours/week ' + (c.medianHoursAt24 == null ? '—' : c.medianHoursAt24.toFixed(1)) + '"><span>' + esc(sName(c.strategy)) + '</span><span class="tr"><i style="width:' + (Math.max(0, c.medianNet24 || 0) / maxNet * 100).toFixed(1) + '%;background:#2a78d6"></i></span><span>' + compact(c.medianNet24 || 0) + '</span>' +
              '<button style="padding:0 5px" title="Play this scenario" data-l="play" data-s="' + c.strategy + '" data-e="' + ec.id + '">▶</button></div>';
          }).join('') + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
    el.innerHTML = h;
  }
  function runLab() {
    if (labRunning) return;
    labRunning = true;
    var runs = +$('labRuns').value || 200, months = +$('labMonths').value || 36;
    var jobs = [];
    E.STRATEGIES.forEach(function (st) { E.ECONOMIES.forEach(function (ec) { jobs.push([st.id, ec.id]); }); });
    var cells = [], i = 0, t0 = performance.now();
    $('labProg').style.display = 'block';
    $('view-analysis').querySelector('[data-l=run]').disabled = true;
    (function next() {
      if (i >= jobs.length) {
        var summary = E.labSummarize(cells);
        var rep = cells.filter(function (c) { return c.strategy === summary.best && c.economy === 'normal'; })[0];
        lab = { cells: cells, summary: summary, timeline: E.labTimeline(summary.best, 'normal', rep.representativeSeed, months), when: new Date().toISOString().slice(0, 10) };
        lab.timeline.ledger = undefined;
        try { localStorage.setItem('haspot-sim-lab', JSON.stringify(lab)); } catch (e) { /* ignore */ }
        labRunning = false; renderLab();
        return;
      }
      var j = jobs[i];
      $('labProgTxt').textContent = 'Running ' + sName(j[0]) + ' in ' + eName(j[1]) + ' (' + (i + 1) + ' of ' + jobs.length + ')…';
      cells.push(E.labCell(j[0], j[1], { runs: runs, months: months }));
      i++;
      $('labProg').querySelector('i').style.width = (i / jobs.length * 100) + '%';
      setTimeout(next, 0);
    })();
  }
  $('view-analysis').addEventListener('click', function (e) {
    var b = e.target.closest('[data-l]'); if (!b) return;
    var l = b.dataset.l;
    if (l === 'run') runLab();
    if (l === 'mc' && S) mcModal(S.presetId || 'P2');
    if (l === 'compare' && S) compareModal();
    if (l === 'md' && lab) download('haspot-scenario-report.md', [E.labPlanMarkdown(lab.cells, lab.summary, lab.timeline, { date: lab.when }), E.labMarkdown(lab.cells, lab.summary, lab.timeline, { date: lab.when })].concat(E.ECONOMIES.map(function (ec) { return E.labEconomyMarkdown(ec.id, lab.cells, lab.summary, null, { date: lab.when }); })).join('\n---\n\n'), 'text/markdown');
    if (l === 'plan' && lab) download('haspot-best-plan.md', E.labPlanMarkdown(lab.cells, lab.summary, lab.timeline, { date: lab.when }), 'text/markdown');
    if (l === 'ecmd' && lab) { var top = lab.summary.byEconomy[b.dataset.e][0]; download('haspot-scenario-' + b.dataset.e + '.md', E.labEconomyMarkdown(b.dataset.e, lab.cells, lab.summary, E.labTimeline(top.strategy, b.dataset.e, top.representativeSeed, top.months), { date: lab.when }), 'text/markdown'); }
    if (l === 'play') {
      var st = b.dataset.s, ec = b.dataset.e;
      var cell = lab && lab.cells.filter(function (c) { return c.strategy === st && c.economy === ec; })[0];
      var g = E.newGame(E.labParams(st, ec), { seed: cell ? cell.representativeSeed : 1 });
      g.presetId = sName(st) + ' · ' + eName(ec);
      startGame(g);
      setTab('dash');
    }
  });

  // ---------- boot ----------
  resize();
  requestAnimationFrame(frame);
  startModal();
  // a game is needed behind the start modal so the map is not blank
  S = E.newGame(E.makeParams({ start: { setup: 'empty' }, growth: { autoExpand: false } }), { seed: 1 });
  setTab(tab);
  fitView(); renderAll();
  window.HaspotUI = { get state() { return S; }, tick: function () { doTick(); renderAll(); }, step: function () { stepMonth(); }, startGame: startGame, setTab: setTab, get tab() { return tab; } };
})();
</script>
